                  <p className="mt-1 max-w-xl text-xs leading-relaxed text-slate-400 sm:text-sm">{t.genreStatsIntro}</p>
                </div>
                <button
                  type="button"
                  onClick={() => loadGenreStats(selectedUser)}
                  className="rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-[11px] text-slate-400 transition-colors hover:border-teal-400 hover:text-teal-400"
                >
                  {t.genreStatsRetry}
                </button>
              </div>

              <div className="genre-overview-grid mt-7 grid grid-cols-1 gap-7">
                <div className="genre-donut-panel mx-auto w-full max-w-[210px] sm:max-w-[240px]">
                  <div className="genre-donut mx-auto aspect-square w-full" style={{ background: donutBackground }}>
                    <div className="genre-donut-label px-8">
                      <span className="text-3xl font-black text-white sm:text-4xl">{Math.round(Number(topGenre.percentage || 0))}%</span>
                      <span className="mt-1 max-w-[110px] truncate text-[10px] font-bold tracking-[0.12em] text-teal-400 sm:text-xs">{topGenre.name}</span>
                    </div>
                  </div>
                  <div className="genre-film-perforation mx-auto mt-5 h-3 w-36 rounded-full opacity-50"></div>
                </div>

                <div className="min-w-0">
                  <div className="genre-persona-card rounded-2xl border border-teal-500/30 bg-teal-500/5 p-5 sm:p-6">
                    <div className="flex items-center gap-2 text-[10px] font-bold tracking-[0.18em] text-teal-400">
                      <Film className="h-4 w-4" /> TASTE TYPE
                    </div>
                    <h4 className="mt-3 break-words text-xl font-black leading-snug text-white sm:text-2xl">{persona.title}</h4>

                    {persona.badges?.length > 0 && (
                      <div className="mt-3 flex flex-wrap gap-1.5">
                        {persona.badges.map((badge, index) => (
                          <span
                            key={`${badge}-${index}`}
                            className="genre-persona-badge rounded-full border border-teal-500/25 bg-slate-950/35 px-2.5 py-1 text-[9px] font-semibold text-teal-300 sm:text-[10px]"
                          >
                            {badge}
                          </span>
                        ))}
                      </div>
                    )}

                    {persona.axisDetails?.length > 0 && (
                      <div className="mt-5 grid gap-2 sm:grid-cols-2">
                        {persona.axisDetails.map((axis, index) => (
                          <div
                            key={axis.id}
                            className={`genre-axis-card ${index === 0 ? 'genre-axis-card-primary' : 'genre-axis-card-secondary'} rounded-xl border p-3.5 ${index === 0 ? 'border-teal-500/30 bg-teal-500/5' : 'border-indigo-400/25 bg-indigo-400/5'}`}
                          >
                            <div className="flex items-center justify-between gap-3">
                              <p className={`genre-axis-name text-xs font-bold ${index === 0 ? 'text-teal-300' : 'text-indigo-300'}`}>{axis.name}</p>
                              <span className="genre-axis-score shrink-0 font-mono text-sm font-black text-white">{axis.score}%</span>
                            </div>
                            <p className="genre-axis-genres mt-1.5 text-[10px] font-semibold text-slate-400">{axis.genres}</p>
                            <p className="genre-axis-description mt-1.5 text-[11px] leading-relaxed text-slate-300">{axis.description}</p>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="mt-5 space-y-3">
                      <div className="genre-insight-card rounded-xl border border-slate-700/70 bg-slate-950/30 p-3.5 sm:p-4">
                        <p className="genre-insight-title-01 text-[9px] font-bold tracking-[0.16em] text-teal-400">01 · {t.genreStatsTasteInsight}</p>
                        <p className="mt-2 text-sm leading-relaxed text-slate-300">{persona.summary}</p>
                      </div>
                      <div className="genre-insight-card rounded-xl border border-slate-700/70 bg-slate-950/30 p-3.5 sm:p-4">
                        <p className="genre-insight-title-02 text-[9px] font-bold tracking-[0.16em] text-indigo-300">02 · {t.genreStatsDiscovery}</p>
                        <p className="mt-2 text-sm leading-relaxed text-slate-300">{persona.discovery}</p>
                      </div>
                      <div className="genre-insight-card rounded-xl border border-slate-700/70 bg-slate-950/30 p-3.5 sm:p-4">
                        <p className="genre-insight-title-03 text-[9px] font-bold tracking-[0.16em] text-amber-300">03 · {t.genreStatsViewingStyle}</p>
                        <p className="mt-2 text-sm leading-relaxed text-slate-300">{persona.style}</p>
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 grid grid-cols-3 gap-2">
                    <div className="rounded-xl border border-slate-800 bg-slate-950/45 px-3 py-3 text-center">
                      <p className="text-lg font-black text-white">{genreStats.analyzedCount || 0}</p>
                      <p className="mt-0.5 text-[9px] leading-tight text-slate-500 sm:text-[10px]">{t.genreStatsAnalyzed}</p>
                    </div>
                    <div className="rounded-xl border border-slate-800 bg-slate-950/45 px-3 py-3 text-center">
                      <p className="text-lg font-black text-white">{genres.length}</p>
                      <p className="mt-0.5 text-[9px] leading-tight text-slate-500 sm:text-[10px]">{t.genreStatsGenres}</p>
                    </div>
                    <div className="rounded-xl border border-slate-800 bg-slate-950/45 px-3 py-3 text-center">
                      <p className="text-lg font-black text-yellow-400">{averageRating ? averageRating.toFixed(1) : '-'}</p>
                      <p className="mt-0.5 text-[9px] leading-tight text-slate-500 sm:text-[10px]">{t.genreStatsAverage}</p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section className="rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-6 shadow-lg">
              <div className="space-y-4">
                {genreListRows.map((genre, index) => (
                  <div key={genre.id} className="grid grid-cols-[28px_minmax(0,1fr)_auto] items-center gap-3">
                    <span className="text-center font-mono text-[10px] text-slate-600">
                      {String(index + 1).padStart(2, '0')}
                    </span>
                    <div className="min-w-0">
                      <div className="mb-1.5 flex min-w-0 items-center justify-between gap-3">
                        <span className="truncate text-xs font-semibold text-slate-200 sm:text-sm">{genre.name}</span>
                        <span className="shrink-0 text-[9px] text-slate-500 sm:text-[10px]">
                          {genre.movieCount}{t.genreStatsIncluded}
                        </span>
                      </div>
                      <div className="h-2 overflow-hidden rounded-full bg-slate-800">
                        <div
                          className="h-full rounded-full transition-all duration-700"
                          style={{
                            width: `${Math.max(0.75, Number(genre.rawPercentage || 0))}%`,
                            backgroundColor: GENRE_CHART_COLORS[index % GENRE_CHART_COLORS.length]
                          }}
                        ></div>
                      </div>
                    </div>
                    <span className="min-w-[44px] text-right text-sm font-black text-white">
                      {genre.displayPercentage}%
                    </span>
                  </div>
                ))}
              </div>

              <div className="mt-6 border-t border-slate-800 pt-4">
                <p className="text-[10px] leading-relaxed text-slate-500">ⓘ {t.genreStatsMethod}</p>
                {Number(genreStats.unresolvedCount || 0) > 0 && (
                  <p className="mt-1.5 text-[10px] leading-relaxed text-amber-400/80">
                    {t.genreStatsUnresolved}: {genreStats.unresolvedCount}{t.genreStatsUnit}
                  </p>
                )}
                <p className="mt-2 text-[9px] text-slate-600">{t.tmdbAttribution}</p>
              </div>
            </section>



            <section className="rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-7 shadow-xl">
              <div className="flex flex-wrap items-start justify-between gap-4">
                <div>
                  <p className="text-[10px] font-bold tracking-[0.28em] text-amber-300">{t.keywordStatsEyebrow}</p>
                  <h3 className="mt-2 text-xl font-black text-white sm:text-2xl">{t.keywordStatsTitle}</h3>
                  <p className="mt-1 max-w-xl text-xs leading-relaxed text-slate-400 sm:text-sm">{t.keywordStatsIntro}</p>
                </div>
                <Lightbulb className="h-7 w-7 text-amber-300" />
              </div>

              {keywords.length === 0 ? (
                <div className="mt-6 rounded-xl border border-dashed border-slate-700 bg-slate-950/30 px-4 py-10 text-center text-sm text-slate-500">
                  {t.keywordStatsEmpty}
                </div>
              ) : (
                <>
                  <div className="mt-6 grid gap-3 sm:grid-cols-2">
                    <div className="rounded-2xl border border-amber-400/25 bg-amber-400/5 p-5">
                      <p className="text-[10px] font-bold tracking-[0.14em] text-amber-300">{t.keywordStatsMostSeen}</p>
                      <p className="mt-3 break-words text-2xl font-black text-white">{mostFrequentKeyword?.name || '-'}</p>
                      <p className="mt-2 text-xs text-slate-400">
                        {mostFrequentKeyword?.movieCount || 0}{t.keywordStatsIncluded} · {Math.round(Number(mostFrequentKeyword?.percentage || 0))}%
                      </p>
                    </div>
                    <div className="rounded-2xl border border-teal-400/25 bg-teal-400/5 p-5">
                      <p className="text-[10px] font-bold tracking-[0.14em] text-teal-300">{t.keywordStatsBestRated}</p>
                      <p className="mt-3 break-words text-2xl font-black text-white">{bestRatedKeyword?.name || '-'}</p>
                      <p className="mt-2 text-xs text-slate-400">
                        {bestRatedKeyword
                          ? `${t.keywordStatsAverage} ${Number(bestRatedKeyword.averageRating || 0).toFixed(1)} · ${bestRatedKeyword.movieCount}${t.keywordStatsIncluded}`
                          : '-'}
                      </p>
                    </div>
                  </div>

                  <div className="mt-6 space-y-3">
                    {keywords.slice(0, 12).map((keyword, index) => (
                      <div key={keyword.id} className="grid grid-cols-[28px_minmax(0,1fr)_auto] items-center gap-3">
                        <span className="text-center font-mono text-[10px] text-slate-600">{String(index + 1).padStart(2, '0')}</span>
                        <div className="min-w-0">
                          <div className="mb-1.5 flex min-w-0 items-center justify-between gap-3">
                            <span className="truncate text-xs font-semibold text-slate-200 sm:text-sm">{keyword.name}</span>
                            <span className="shrink-0 text-[9px] text-slate-500 sm:text-[10px]">
                              {keyword.movieCount}{t.keywordStatsIncluded}
                              {Number(keyword.averageRating || 0) > 0 ? ` · ★ ${Number(keyword.averageRating).toFixed(1)}` : ''}
                            </span>
                          </div>
                          <div className="h-2 overflow-hidden rounded-full bg-slate-800">
                            <div
                              className="h-full rounded-full transition-all duration-700"
                              style={{
                                width: `${Math.max(2, (Number(keyword.movieCount || 0) / maxKeywordCount) * 100)}%`,
                                backgroundColor: GENRE_CHART_COLORS[(index + 2) % GENRE_CHART_COLORS.length]
                              }}
                            ></div>
                          </div>
                        </div>
                        <span className="min-w-[44px] text-right text-sm font-black text-white">
                          {Math.round(Number(keyword.percentage || 0))}%
                        </span>
                      </div>
                    ))}
                  </div>
                </>
              )}

              <div className="mt-6 border-t border-slate-800 pt-4">
                <p className="text-[10px] leading-relaxed text-slate-500">ⓘ {t.keywordStatsMethod}</p>
                <p className="mt-1.5 text-[10px] text-slate-500">
                  {keywordStats.analyzedCount || 0}{t.genreStatsUnit} · {t.keywordStatsAnalyzed}
                </p>
                {Number(keywordStats.unresolvedCount || 0) > 0 && (
                  <p className="mt-1.5 text-[10px] text-amber-400/80">
                    {t.keywordStatsUnresolved}: {keywordStats.unresolvedCount}{t.genreStatsUnit}
                  </p>
                )}
              </div>
            </section>
          </div>
        );
      };

      useEffect(() => {
        if (!selectedUser || userViewMode !== 'genre') return;
        loadGenreStats(selectedUser);
      }, [selectedUser, userViewMode, appLang]);

      const renderUser = () => {
        if (selectedUser) {
          const userReviews = appData.reviews.filter(r => r.nickname === selectedUser);

          // 전체 보기: 관람일 기준 최신순. 같은 관람일이면 최근 등록한 리뷰를 먼저 표시합니다.
          const dateSortedReviews = [...userReviews].sort((a, b) => {
            const dateA = formatDateOnly(a.date) || '0000-00-00';
            const dateB = formatDateOnly(b.date) || '0000-00-00';
            const dateCompare = dateB.localeCompare(dateA);
            if (dateCompare !== 0) return dateCompare;

            const createdAtA = new Date(a.createdAt || 0).getTime() || 0;
            const createdAtB = new Date(b.createdAt || 0).getTime() || 0;
            return createdAtB - createdAtA;
          });
          
          const sortedReviews = [...userReviews].sort((a, b) => {
            if (ratingSortOrder === 'desc') return b.rating - a.rating;
            return a.rating - b.rating;
          });

          return (
            <div className="animate-in slide-in-from-right-4">
              <button onClick={() => { setSelectedUser(null); setExpandedReviews({}); setPosterTarget(null); }} className="text-teal-400 text-sm mb-4 hover:underline flex items-center gap-1">← {t.backToList}</button>
              <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2">
                <span className="text-2xl">{USER_EMOJIS[selectedUser]}</span> {selectedUser}{t.userReviews} ({userReviews.length})
              </h2>

              {userReviews.length > 0 && (
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                  <div className="flex bg-slate-800 rounded-lg p-1 shrink-0 w-full sm:w-auto overflow-x-auto">
                    <button onClick={() => { setUserViewMode('default'); setExpandedReviews({}); }} className={`flex-1 sm:flex-none px-3 sm:px-4 py-1.5 text-xs sm:text-sm rounded-md transition-colors whitespace-nowrap ${userViewMode === 'default' ? 'bg-teal-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}>{t.viewDefault}</button>
                    <button onClick={() => { setUserViewMode('compact'); setExpandedReviews({}); }} className={`flex-1 sm:flex-none px-3 sm:px-4 py-1.5 text-xs sm:text-sm rounded-md transition-colors whitespace-nowrap ${userViewMode === 'compact' ? 'bg-teal-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}>{t.viewCompact}</button>
                    <button onClick={() => { setUserViewMode('calendar'); setExpandedReviews({}); }} className={`flex-1 sm:flex-none px-3 sm:px-4 py-1.5 text-xs sm:text-sm rounded-md transition-colors whitespace-nowrap ${userViewMode === 'calendar' ? 'bg-teal-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}>{t.viewCalendar}</button>
                    <button onClick={() => { setUserViewMode('genre'); setExpandedReviews({}); }} className={`flex-1 sm:flex-none px-3 sm:px-4 py-1.5 text-xs sm:text-sm rounded-md transition-colors whitespace-nowrap ${userViewMode === 'genre' ? 'bg-teal-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}>{t.viewGenre}</button>
                  </div>
                  
                  {userViewMode === 'compact' && (
                    <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                      <select value={ratingSortOrder} onChange={(e) => setRatingSortOrder(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-teal-400 cursor-pointer">
                        <option value="desc">{t.sortDesc}</option>
                        <option value="asc">{t.sortAsc}</option>
                      </select>
                    </div>
                  )}
                </div>
              )}

              {userReviews.length === 0 ? (
                <p className="text-slate-500 text-center py-10">{t.noData}</p>
              ) : userViewMode === 'genre' ? (
                renderGenreTaste(userReviews)
              ) : userViewMode === 'default' ? (
                <div className="grid gap-6">
                  {dateSortedReviews.map(r => (
                    <div key={r.id} className="review-card-safe bg-slate-900 border border-slate-800 p-4 sm:p-5 rounded-2xl shadow-lg relative group">
                      {editingItem?.id === r.id ? (
                        <form onSubmit={handleEditSave} className="space-y-3 mb-4">
                          <div className="flex flex-col sm:flex-row gap-2">
                            <CurrentUserBadge className="w-full sm:w-auto py-1.5" />
                            <input type="date" required value={editingItem.form.date} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, date: e.target.value } })} className="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:border-teal-400" />
                            <ReviewMovieEditField />
                          </div>
                          <div className="flex items-center gap-4 bg-slate-800/30 p-2 rounded">
                             <span className="text-teal-400 text-sm font-bold w-6">{editingItem.form.rating}</span>
                             <input type="range" min="0.5" max="5" step="0.5" value={editingItem.form.rating} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, rating: e.target.value } })} className="flex-1 accent-teal-500" />
                             <div className="flex justify-center">{renderStars(parseFloat(editingItem.form.rating))}</div>
                          </div>
                          <textarea placeholder={t.placeholderReview} value={editingItem.form.comment || ''} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, comment: e.target.value } })} className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white resize-y min-h-[120px] focus:border-teal-400" rows="5" />
                          <label className={`flex cursor-pointer items-start gap-2.5 rounded-lg border px-3 py-2.5 transition-colors ${editingItem.form.hideFromSummary ? 'border-teal-500/40 bg-teal-500/5' : 'border-slate-700 bg-slate-800/30 hover:border-slate-600'}`}>
                            <input
                              type="checkbox"
                              checked={!!editingItem.form.hideFromSummary}
                              onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, hideFromSummary: e.target.checked } })}
                              className="peer sr-only"
                            />
                            <span className={`mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded border transition-colors ${editingItem.form.hideFromSummary ? 'border-teal-500 bg-teal-500 text-slate-950' : 'border-slate-600 bg-slate-800 text-transparent'}`}>
                              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="h-3 w-3">
                                <path d="m5 12 4 4L19 6" />
                              </svg>
                            </span>
                            <span className="min-w-0">
                              <span className={`block text-xs font-medium transition-colors ${editingItem.form.hideFromSummary ? 'text-teal-300' : 'text-slate-400'}`}>{t.hideFromSummary}</span>
                              <span className="mt-0.5 block text-[10px] leading-relaxed text-slate-500">{t.hideFromSummaryGuide}</span>
                            </span>
                          </label>
                          <div className="flex justify-end gap-2">
                            <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-1.5 text-sm bg-slate-700 rounded hover:bg-slate-600 transition-colors">{t.cancel}</button>
                            <button type="submit" disabled={isSubmitting} className="px-4 py-1.5 text-sm bg-teal-500 text-slate-900 font-bold rounded hover:bg-teal-400 transition-colors">{t.save}</button>
                          </div>
                        </form>
                      ) : (
                        <>
                          {/* ✨ 모바일 최적화: pr-16 제거, 버튼 인라인 배치 ✨ */}
                          <div className="review-card-head grid grid-cols-[minmax(0,1fr)_auto] items-start mb-3 gap-2 sm:gap-3">
                            <div className="min-w-0 flex-1">
                              <h3 className="min-w-0 max-w-full text-base sm:text-lg font-bold text-white break-all leading-tight"><MovieTitleButton review={r} /></h3>
                              <div className="flex flex-wrap gap-2 text-[11px] sm:text-xs text-slate-400 items-center mt-1.5">
                                <span className="bg-slate-800 px-2 py-0.5 rounded flex items-center gap-1 shrink-0">{USER_EMOJIS[r.nickname]} {r.nickname}</span>
                                <span className="shrink-0">{formatDateOnly(r.date)} (Week {r.week})</span>
                                {isOwner(r) && (
                                  <div className="flex gap-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity ml-auto sm:ml-1 shrink-0">
                                    <button onClick={() => setEditingItem({ id: r.id, type: 'review', form: { date: formatDateOnly(r.date), movieTitle: r.movieTitle, rating: r.rating, comment: appLang === 'ko' ? r.commentKo : r.commentJp, hideFromSummary: !!r.hideFromSummary } })} className="text-slate-400 hover:text-teal-400 p-1"><Edit2 className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                    <button onClick={() => requestDelete(r.id, 'review')} className="text-slate-400 hover:text-red-400 p-1"><Trash2 className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                  </div>
                                )}
                              </div>
                            </div>
                            <div className="bg-slate-800/80 px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg text-center shrink-0 flex flex-col items-center justify-center border border-slate-700/50 shadow-inner">
                              <div className="text-base sm:text-lg font-bold text-yellow-400 leading-none mb-0.5 sm:mb-1">{r.rating}</div>
                              {renderStars(r.rating)}
                            </div>
                          </div>
                          {((appLang === 'ko' ? r.commentKo : r.commentJp) || '').trim() && (
                          <SpoilerText text={appLang === 'ko' ? r.commentKo : r.commentJp} className="mobile-break-anywhere block w-full min-w-0 max-w-full text-left text-slate-300 text-sm mt-3 whitespace-pre-wrap break-all leading-relaxed" />
                        )}
                        </>
                      )}
                      <CommentSection parentId={r.id} parentType="review" />
                    </div>
                  ))}
                </div>
              ) : userViewMode === 'calendar' ? (
                renderUserCalendar(userReviews)
              ) : (
                /* ✨ 별점 모아보기 (Compact View) 화면 ✨ */
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 animate-in fade-in duration-300 items-start">
                  {sortedReviews.map(r => {
                    const isExpanded = expandedReviews[r.id];

                    if (isExpanded) {
                      return (
                        <div key={r.id} className="review-card-safe bg-slate-900 border border-slate-800 p-4 sm:p-5 rounded-2xl shadow-lg relative group sm:col-span-2 animate-in fade-in zoom-in-95 duration-200">
                          {editingItem?.id === r.id ? (
                            <form onSubmit={handleEditSave} className="space-y-3 mb-4">
                              <div className="flex flex-col sm:flex-row gap-2">
                                <CurrentUserBadge className="w-full sm:w-auto py-1.5" />
                                <input type="date" required value={editingItem.form.date} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, date: e.target.value } })} className="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:border-teal-400" />
                                <ReviewMovieEditField />
                              </div>
                              <div className="flex items-center gap-4 bg-slate-800/30 p-2 rounded">
                                 <span className="text-teal-400 text-sm font-bold w-6">{editingItem.form.rating}</span>
                                 <input type="range" min="0.5" max="5" step="0.5" value={editingItem.form.rating} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, rating: e.target.value } })} className="flex-1 accent-teal-500" />
                                 <div className="flex justify-center">{renderStars(parseFloat(editingItem.form.rating))}</div>
                              </div>
                              <textarea placeholder={t.placeholderReview} value={editingItem.form.comment || ''} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, comment: e.target.value } })} className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white resize-y min-h-[120px] focus:border-teal-400" rows="5" />
                              <label className={`flex cursor-pointer items-start gap-2.5 rounded-lg border px-3 py-2.5 transition-colors ${editingItem.form.hideFromSummary ? 'border-teal-500/40 bg-teal-500/5' : 'border-slate-700 bg-slate-800/30 hover:border-slate-600'}`}>
                                <input
                                  type="checkbox"
                                  checked={!!editingItem.form.hideFromSummary}
                                  onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, hideFromSummary: e.target.checked } })}
                                  className="peer sr-only"
                                />
                                <span className={`mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded border transition-colors ${editingItem.form.hideFromSummary ? 'border-teal-500 bg-teal-500 text-slate-950' : 'border-slate-600 bg-slate-800 text-transparent'}`}>
                                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="h-3 w-3">
                                    <path d="m5 12 4 4L19 6" />
                                  </svg>
                                </span>
                                <span className="min-w-0">
                                  <span className={`block text-xs font-medium transition-colors ${editingItem.form.hideFromSummary ? 'text-teal-300' : 'text-slate-400'}`}>{t.hideFromSummary}</span>
                                  <span className="mt-0.5 block text-[10px] leading-relaxed text-slate-500">{t.hideFromSummaryGuide}</span>
                                </span>
                              </label>
                              <div className="flex justify-end gap-2">
                                <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-1.5 text-sm bg-slate-700 rounded hover:bg-slate-600 transition-colors">{t.cancel}</button>
                                <button type="submit" disabled={isSubmitting} className="px-4 py-1.5 text-sm bg-teal-500 text-slate-900 font-bold rounded hover:bg-teal-400 transition-colors">{t.save}</button>
                              </div>
                            </form>
                          ) : (
                            <>
                              <div className="review-card-head grid grid-cols-[minmax(0,1fr)_auto] items-start mb-3 gap-2 sm:gap-3">
                                <div className="min-w-0 flex-1">
                                  <h3 className="min-w-0 max-w-full text-base sm:text-lg font-bold text-white break-all leading-tight">
                                    <MovieTitleButton review={r} />
                                  </h3>
                                  <div className="flex flex-wrap gap-2 text-[11px] sm:text-xs text-slate-400 items-center mt-1.5">
                                    <span className="bg-slate-800 px-2 py-0.5 rounded flex items-center gap-1 shrink-0">{USER_EMOJIS[r.nickname]} {r.nickname}</span>
                                    <span className="shrink-0">{formatDateOnly(r.date)} (Week {r.week})</span>
                                    <div className="flex gap-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity ml-auto sm:ml-1 shrink-0">
                                      {isOwner(r) && (
                                        <>
                                          <button onClick={() => setEditingItem({ id: r.id, type: 'review', form: { date: formatDateOnly(r.date), movieTitle: r.movieTitle, rating: r.rating, comment: appLang === 'ko' ? r.commentKo : r.commentJp, hideFromSummary: !!r.hideFromSummary } })} className="text-slate-400 hover:text-teal-400 p-1"><Edit2 className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                          <button onClick={() => requestDelete(r.id, 'review')} className="text-slate-400 hover:text-red-400 p-1"><Trash2 className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                          <div className="w-px h-3 bg-slate-700 self-center mx-0.5"></div>
                                        </>
                                      )}
                                      <button onClick={() => toggleReviewExpand(r.id)} className="text-slate-400 hover:text-white p-1" title="닫기"><X className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                    </div>
                                  </div>
                                </div>
                                <div className="bg-slate-800/80 px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg text-center shrink-0 flex flex-col items-center justify-center border border-slate-700/50 shadow-inner">
                                  <div className="text-base sm:text-lg font-bold text-yellow-400 leading-none mb-0.5 sm:mb-1">{r.rating}</div>
                                  {renderStars(r.rating)}
                                </div>
                              </div>
                              {((appLang === 'ko' ? r.commentKo : r.commentJp) || '').trim() && (
                          <SpoilerText text={appLang === 'ko' ? r.commentKo : r.commentJp} className="mobile-break-anywhere block w-full min-w-0 max-w-full text-left text-slate-300 text-sm mt-3 whitespace-pre-wrap break-all leading-relaxed" />
                        )}
                            </>
                          )}
                          <CommentSection parentId={r.id} parentType="review" />
                        </div>
                      );
                    }

                    return (
                      <div key={r.id} onClick={() => toggleReviewExpand(r.id)} className="review-card-safe bg-slate-900 border border-slate-800 p-3 sm:p-4 rounded-xl shadow-sm grid grid-cols-[minmax(0,1fr)_auto] items-center group hover:border-teal-500/50 transition-all cursor-pointer hover:-translate-y-0.5">
                        <div className="min-w-0 pr-3 sm:pr-4">
                          <h4 className="min-w-0 max-w-full text-sm sm:text-base text-white font-medium truncate mb-1"><MovieTitleButton review={r} className="w-full" truncate={true} /></h4>
                          <span className="text-[11px] sm:text-xs text-slate-500 flex items-center gap-1">
                            <CalendarDays className="w-3 h-3" /> {formatDateOnly(r.date)} (Week {r.week})
                          </span>
                        </div>
                        <div className="bg-slate-800/80 px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-lg text-center shrink-0 flex flex-col items-center justify-center border border-slate-700/50 shadow-inner">
                          <span className="text-base sm:text-lg font-bold text-yellow-400 leading-none mb-0.5 sm:mb-1">{r.rating}</span>
                          {renderStars(r.rating)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        }

        return (
          <div className="animate-in fade-in grid grid-cols-2 md:grid-cols-3 gap-4">
            {NICKNAMES.map(name => {
              const count = appData.reviews.filter(r => r.nickname === name).length;
              return (
                <div key={name} onClick={() => openUserProfile(name)} className="bg-slate-900 border border-slate-800 hover:border-teal-500 p-6 rounded-2xl cursor-pointer text-center group transition-all">
                   <div className="w-16 h-16 mx-auto bg-slate-800 rounded-full flex items-center justify-center mb-3 group-hover:bg-teal-500/20 transition-colors text-3xl">
                      {USER_EMOJIS[name]}
                   </div>
                   <h3 className="text-lg font-bold text-slate-200 group-hover:text-white">{name}</h3>
                   <p className="text-sm text-teal-500 mt-1">{count} Reviews</p>
                </div>
              );
            })}
          </div>
        );
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4 py-10 bg-slate-950">
            <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-7 shadow-2xl">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-teal-500/20 text-teal-400 flex items-center justify-center mb-4">
                <Film className="w-7 h-7" />
              </div>
              <h1 className="text-2xl font-black text-teal-400 text-center">{t.loginTitle}</h1>
              <p className="mt-2 text-sm text-slate-400 text-center">{t.loginGuide}</p>

              <form onSubmit={handleLogin} className="mt-6 space-y-4">
                <div>
                  <label className="block text-xs text-slate-400 mb-1.5">{t.loginUser}</label>
                  <select
                    value={loginUser}
                    onChange={e => setLoginUser(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                  >
                    {NICKNAMES.map(name => (
                      <option key={name} value={name}>{USER_EMOJIS[name]} {name}</option>
                    ))}
                  </select>
                </div>

                <button
                  type="submit"
                  className="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-3 rounded-lg flex items-center justify-center gap-2"
                >
                  <User className="w-4 h-4" />
                  {t.loginButton}
                </button>
              </form>

              <div className="mt-5 flex items-center justify-center gap-2">
                <button
                  type="button"
                  onClick={() => setTheme(prev => prev === 'dark' ? 'light' : 'dark')}
                  className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition-colors"
                >
                  {theme === 'dark' ? <Sun className="w-3.5 h-3.5 text-teal-400" /> : <Moon className="w-3.5 h-3.5 text-teal-400" />}
                  {theme === 'dark' ? t.themeToLight : t.themeToDark}
                </button>
                <button
                  type="button"
                  onClick={() => setAppLang(t.langCode)}
                  className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition-colors"
                >
                  <Globe className="w-3.5 h-3.5 text-teal-400" /> {t.toggleLang}
                </button>
              </div>
            </div>
          </div>
        );
      }

      const matchingMovieReviews = selectedMovieInfo ? getMatchingMovieReviews(selectedMovieInfo) : [];
      const matchingMovieRatings = matchingMovieReviews
        .map(review => Number(review.rating))
        .filter(rating => Number.isFinite(rating));
      const matchingMovieAverage = matchingMovieRatings.length
        ? matchingMovieRatings.reduce((sum, rating) => sum + rating, 0) / matchingMovieRatings.length
        : 0;
      const matchingMovieMemberCount = new Set(matchingMovieReviews.map(review => review.nickname)).size;

      return (
        <>
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 shadow-lg">
            <div className="max-w-6xl mx-auto px-4 pt-4">
              <div className="flex justify-between items-center mb-4">
                <div>
                  <h1 className="text-2xl font-black text-teal-400 tracking-tight">{t.title}</h1>
                  <p className="text-xs text-slate-400 mt-0.5">{t.subtitle}</p>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={handleLogout}
                    className="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-red-500/10 hover:text-red-400 text-xs px-3 py-1.5 rounded-full border border-slate-700 hover:border-red-500/30 transition-colors"
                    title={t.logout}
                  >
                    <User className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">{t.logout}</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setTheme(prev => prev === 'dark' ? 'light' : 'dark')}
                    className="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-xs w-8 h-8 sm:w-auto sm:h-auto sm:px-3 sm:py-1.5 rounded-full border border-slate-700 transition-colors"
                    aria-label={theme === 'dark' ? t.themeToLight : t.themeToDark}
                    title={theme === 'dark' ? t.themeToLight : t.themeToDark}
                  >
                    {theme === 'dark'
                      ? <Sun className="w-3.5 h-3.5 text-teal-400" />
                      : <Moon className="w-3.5 h-3.5 text-teal-400" />}
                    <span className="hidden sm:inline">{theme === 'dark' ? t.themeToLight : t.themeToDark}</span>
                  </button>
                  <button onClick={() => setAppLang(t.langCode)} className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-full border border-slate-700 transition-colors">
                    <Globe className="w-3.5 h-3.5 text-teal-400" /> {t.toggleLang}
                  </button>
                </div>
              </div>
              <div className="flex gap-1 overflow-x-auto no-scrollbar pb-1">
                {[
                  { id: 'summary', icon: ClipboardList, label: t.navSummary },
                  { id: 'board', icon: MessageSquare, label: t.navBoard },
                  { id: 'album', icon: Film, label: t.navAlbum },
                  { id: 'user', icon: Users, label: t.navUser }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => {
                      setActiveTab(tab.id);
                      if (tab.id === 'board') setBoardSection(null);
                      setSelectedPost(null);
                      setSelectedUser(null);
                      setExpandedReviews({});
                      setPosterTarget(null);
                      closeMovieInfo();
                    }}
                    className={`flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap
                      ${activeTab === tab.id ? 'border-teal-400 text-teal-400 bg-teal-400/5' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}
                  >
                    <tab.icon className="w-4 h-4" /> {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main className={`w-full max-w-2xl mx-auto px-2.5 sm:px-4 py-6 sm:py-8 transition-[max-width] duration-300 ${activeTab === 'album' ? 'lg:max-w-6xl' : 'lg:max-w-4xl'}`}>
            {isLoading ? (
               <div className="flex flex-col items-center justify-center py-20 text-teal-500">
                 <Loader2 className="w-8 h-8 animate-spin mb-4" />
                 <p className="text-sm">데이터를 불러오는 중...</p>
               </div>
            ) : (
              <>
                {activeTab === 'summary' && renderSummary()}
                {activeTab === 'board' && renderBoardHub()}
                {activeTab === 'album' && renderAlbum()}
                {activeTab === 'user' && renderUser()}
              </>
            )}
          </main>

          {appData.reviews.length > 0 && !randomPickerOpen && !movieInfoTarget && !posterTarget && (
            <button
              type="button"
              onClick={drawRandomMovie}
              className="random-picker-fab fixed bottom-5 right-4 z-40 flex h-12 items-center gap-2 rounded-full border border-teal-300/40 bg-teal-500 px-4 text-sm font-black text-slate-950 transition-transform hover:scale-105 active:scale-95 sm:bottom-6 sm:right-6"
              aria-label={randomMovieCopy.button}
              title={randomMovieCopy.button}
            >
              <span className="flex h-7 w-7 items-center justify-center rounded-full bg-slate-950/15">
                <Film className="h-4 w-4" />
              </span>
              <span className="hidden sm:inline">{randomMovieCopy.button}</span>
            </button>
          )}

          {randomPickerOpen && (
            <div
              className="fixed inset-0 z-[58] flex items-center justify-center bg-slate-950/88 px-4 py-5 backdrop-blur-md animate-in fade-in duration-200"
              onClick={closeRandomMoviePicker}
            >
              <div
                className="mobile-width-safe w-full max-w-sm overflow-hidden rounded-[28px] border border-slate-700 bg-slate-900 shadow-2xl animate-in zoom-in-95 duration-200"
                onClick={event => event.stopPropagation()}
              >
                <div className="flex items-start justify-between gap-4 border-b border-slate-800 px-5 py-4">
                  <div className="min-w-0">
                    <p className="text-[10px] font-bold tracking-[0.22em] text-teal-400">MOVIE ROULETTE</p>
                    <h2 className="mt-1 text-lg font-black text-white">{randomMovieCopy.title}</h2>
                    <p className="mt-1 text-xs leading-relaxed text-slate-500">{randomMovieCopy.guide}</p>
                  </div>
                  <button
                    type="button"
                    onClick={closeRandomMoviePicker}
                    className="shrink-0 rounded-full p-2 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
                    aria-label={randomMovieCopy.close}
                    title={randomMovieCopy.close}
                  >
                    <X className="h-5 w-5" />
                  </button>
                </div>

                <div className="relative overflow-hidden px-5 pb-5 pt-6">
                  <div className="pointer-events-none absolute left-1/2 top-0 h-32 w-32 -translate-x-1/2 rounded-full bg-teal-400/15 blur-3xl"></div>

                  <div className="relative mx-auto w-[172px]">
                    <div
                      key={`random-poster-${randomDrawStep}`}
                      className={`relative aspect-[2/3] overflow-hidden rounded-2xl border border-dashed border-slate-500/80 bg-slate-800 shadow-2xl ${randomPreviewMovie ? 'random-picker-poster-swap' : ''}`}
                    >
                      {randomPreviewMovie && (randomPreviewMovie.posterUrl || getPosterUrl(randomPreviewMovie.representative)) ? (
                        <img
                          src={randomPreviewMovie.posterUrl || getPosterUrl(randomPreviewMovie.representative)}
                          alt={randomPreviewMovie.representative?.movieTitle || ''}
                          className="h-full w-full object-cover"
                        />
                      ) : (
                        <div className="flex h-full flex-col items-center justify-center gap-3 text-slate-600">
                          <Film className={`h-10 w-10 ${isRandomPicking ? 'random-picker-reel-spin' : ''}`} />
                          <span className="text-[10px] font-semibold tracking-widest">NO COVER</span>
                        </div>
                      )}

                      {isRandomPicking && (
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-transparent to-slate-950/20"></div>
                      )}
                    </div>
                  </div>

                  <div className={`mt-5 min-h-[74px] text-center ${randomPickedMovie ? 'random-picker-result-pop' : ''}`}>
                    <div className="flex items-center justify-center gap-2 text-[11px] font-bold text-teal-400">
                      {isRandomPicking && <Film className="random-picker-reel-spin h-3.5 w-3.5" />}
                      <span>{isRandomPicking ? randomMovieCopy.drawing : randomMovieCopy.selected}</span>
                    </div>
                    <h3 className="mt-2 line-clamp-2 text-lg font-black leading-snug text-white">
                      {randomPreviewMovie?.representative?.movieTitle || '—'}
                    </h3>
                    {randomPreviewMovie && (
                      <p className="mt-2 text-[11px] text-slate-500">
                        {randomPreviewMovie.memberCount}{randomMovieCopy.viewers} · {randomPreviewMovie.reviewCount}{randomMovieCopy.reviews} · ★ {Number(randomPreviewMovie.average || 0).toFixed(1)}
                      </p>
                    )}
                  </div>

                  <div className="mt-5 grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={drawRandomMovie}
                      disabled={isRandomPicking}
                      className="rounded-xl border border-slate-700 bg-slate-800 px-3 py-3 text-xs font-bold text-slate-300 transition-colors hover:border-teal-500/60 hover:text-teal-400 disabled:cursor-not-allowed disabled:opacity-40"
                    >
                      {randomMovieCopy.drawAgain}
                    </button>
                    <button
                      type="button"
                      onClick={openPickedMovieInfo}
                      disabled={isRandomPicking || !randomPickedMovie}
                      className="rounded-xl bg-teal-500 px-3 py-3 text-xs font-black text-slate-950 transition-colors hover:bg-teal-400 disabled:cursor-not-allowed disabled:opacity-40"
                    >
                      {randomMovieCopy.openInfo}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {movieInfoTarget && (
            <div
              className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/85 backdrop-blur-sm px-3 sm:px-4 py-4 animate-in fade-in duration-200"
              onClick={closeMovieInfo}
            >
              <div
                className="mobile-width-safe bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-6 w-full max-w-4xl max-h-[92vh] overflow-x-hidden overflow-y-auto shadow-2xl animate-in zoom-in-95 duration-200"
                onClick={e => e.stopPropagation()}
                role="dialog"
                aria-modal="true"
                aria-label={t.movieInfoTitle}
              >
                <div className="flex items-start justify-between gap-4 mb-4">
                  <div className="min-w-0">
                    <p className="text-xs text-teal-400 mb-1">{t.movieInfoTitle}</p>
                    <h2 className="text-lg sm:text-xl font-bold text-white break-words">{movieInfoTarget.movieTitle}</h2>
                  </div>
                  <button
                    type="button"
                    onClick={closeMovieInfo}
                    className="text-slate-400 hover:text-white p-1 shrink-0"
                    aria-label={t.cancel}
                    title={t.cancel}
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={e => {
                    e.preventDefault();
                    searchMovieInfo();
                  }}
                  className="flex flex-col sm:flex-row gap-2 mb-4"
                >
                  <input
                    type="search"
                    value={movieInfoQuery}
                    onChange={e => setMovieInfoQuery(e.target.value)}
                    placeholder={t.movieInfoSearchPlaceholder}
                    className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                  />
                  <button
                    type="submit"
                    disabled={isMovieInfoSearching || !movieInfoQuery.trim()}
                    className="sm:w-auto px-4 py-2.5 rounded-lg bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    {isMovieInfoSearching ? <Loader2 className="w-4 h-4 animate-spin" /> : <Film className="w-4 h-4" />}
                    {t.movieInfoSearchButton}
                  </button>
                </form>

                {isMovieInfoSearching && (
                  <div className="rounded-xl border border-slate-700 bg-slate-800/30 px-4 py-8 text-center text-sm text-slate-400 mb-4">
                    <Loader2 className="w-6 h-6 animate-spin mx-auto mb-3 text-teal-400" />
                    {t.movieInfoSearching}
                  </div>
                )}

                {!isMovieInfoSearching && movieInfoError && (
                  <div className="rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-3 text-sm text-amber-300 leading-relaxed mb-4">
                    {movieInfoError}
                  </div>
                )}

                {!isMovieInfoSearching && selectedMovieInfo && (
                  <div className="grid grid-cols-[96px_1fr] sm:grid-cols-[180px_1fr] gap-4 sm:gap-6 items-start mb-5">
                    <div className="rounded-xl overflow-hidden border border-slate-700 bg-slate-800 aspect-[2/3] flex items-center justify-center">
                      {selectedMovieInfo.poster_path ? (
                        <img
                          src={buildTmdbPosterUrl(selectedMovieInfo.poster_path)}
                          alt={`${selectedMovieInfo.title || selectedMovieInfo.original_title} poster`}
                          className="w-full h-full object-cover"
                          loading="lazy"
                        />
                      ) : (
                        <span className="px-2 text-center text-[11px] text-slate-500">{t.movieInfoNoPoster}</span>
                      )}
                    </div>

                    <div className="min-w-0">
                      <h3 className="text-xl sm:text-2xl font-bold text-white break-words leading-tight">
                        {selectedMovieInfo.title || selectedMovieInfo.original_title}
                      </h3>

                      {selectedMovieInfo.original_title && selectedMovieInfo.original_title !== selectedMovieInfo.title && (
                        <p className="mt-1.5 text-xs sm:text-sm text-slate-400 break-words">
                          <span className="text-slate-500">{t.movieInfoOriginalTitle}</span> · {selectedMovieInfo.original_title}
                        </p>
                      )}

                      <div className="mt-3 inline-flex items-center gap-1.5 rounded-lg bg-slate-800 px-2.5 py-1.5 text-xs sm:text-sm text-slate-300">
                        <Calendar className="w-3.5 h-3.5 text-teal-400" />
                        <span className="text-slate-500">{t.movieInfoReleaseDate}</span>
                        <span>{selectedMovieInfo.release_date || '-'}</span>
                      </div>

                      <div className="mt-4">
                        <h4 className="text-xs font-semibold text-teal-400 mb-1.5">{t.movieInfoOverview}</h4>
                        <p className="text-xs sm:text-sm text-slate-300 leading-relaxed whitespace-pre-wrap break-words">
                          {selectedMovieInfo.overview || t.movieInfoNoOverview}
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {!isMovieInfoSearching && selectedMovieInfo && (
                  <div className="movie-log-rating-panel mb-5 rounded-2xl border border-slate-700 bg-slate-800/35 p-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                      <div>
                        <p className="text-xs font-semibold text-teal-400">{t.movieLogRatingTitle}</p>
                        <p className="mt-1 text-[11px] text-slate-500">
                          {matchingMovieMemberCount}{t.movieLogViewerUnit} · {matchingMovieReviews.length}{t.movieLogReviewUnit}
                        </p>
                      </div>
                      {matchingMovieRatings.length > 0 && (
                        <div className="movie-log-average-box flex items-center gap-2 rounded-xl border border-yellow-400/20 bg-slate-900/70 px-3 py-2">
                          <span className="text-xs text-slate-500">{t.movieLogAverageRating}</span>
                          <span className="text-xl font-bold text-yellow-400">★ {matchingMovieAverage.toFixed(1)}</span>
                        </div>
                      )}
                    </div>

                    {matchingMovieReviews.length > 0 ? (
                      <div>
                        <h4 className="mb-2 text-[11px] font-semibold text-slate-400">{t.movieLogSameMovieMembers}</h4>
                        <div className="mobile-width-safe grid w-full min-w-0 grid-cols-1 lg:grid-cols-2 gap-2">
                          {matchingMovieReviews.map(review => {
                            const isReviewExpanded = !!expandedMovieReviewIds[review.id];
                            const reviewComment = String((appLang === 'ko' ? review.commentKo : review.commentJp) || '').trim();

                            return (
                              <div key={review.id} className={`movie-log-review-card mobile-width-safe w-full min-w-0 max-w-full overflow-hidden rounded-lg border border-slate-700/70 bg-slate-900/60 transition-all ${isReviewExpanded ? 'lg:col-span-2' : ''}`}>
                                <div className="flex min-w-0 max-w-full flex-wrap items-center justify-between gap-2 px-3 py-2">
                                  <div className="min-w-0">
                                    <p className="movie-log-review-name truncate text-xs font-medium text-slate-200">{USER_EMOJIS[review.nickname]} {review.nickname}</p>
                                    <p className="mt-0.5 text-[10px] text-slate-500">{formatDateOnly(review.date)}</p>
                                  </div>
                                  <button
                                    type="button"
                                    onClick={() => toggleMovieReviewDetail(review.id)}
                                    aria-expanded={isReviewExpanded}
                                    title={isReviewExpanded ? t.movieLogCloseReview : t.movieLogOpenReview}
                                    className="movie-log-review-score group/review-score ml-auto inline-flex max-w-full shrink-0 items-center gap-1.5 rounded-lg border border-yellow-400/20 bg-slate-950/70 px-2.5 py-1.5 text-sm font-bold text-yellow-400 transition-colors hover:border-yellow-400/50 hover:bg-yellow-400/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-yellow-400/50"
                                  >
                                    <span>★ {Number(review.rating).toFixed(1)}</span>
                                    <span className="text-[11px] text-slate-400 transition-transform group-hover/review-score:text-yellow-300" aria-hidden="true">
                                      {isReviewExpanded ? '−' : '＋'}
                                    </span>
                                  </button>
                                </div>

                                {isReviewExpanded && (
                                  <div className="movie-log-review-detail mobile-break-anywhere min-w-0 max-w-full overflow-hidden border-t border-slate-700/60 bg-slate-950/35 px-3 py-3 sm:px-5 sm:py-4 animate-in fade-in slide-in-from-top-1 duration-150">
                                    {reviewComment ? (
                                      <SpoilerText
                                        text={reviewComment}
                                        className="block text-left text-xs sm:text-sm text-slate-300 whitespace-pre-wrap break-words leading-relaxed"
                                      />
                                    ) : (
                                      <p className="text-xs text-slate-500">{t.movieLogNoComment}</p>
                                    )}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ) : (
                      <p className="text-xs text-slate-500">{t.movieLogNoSameReviews}</p>
                    )}
                  </div>
                )}

                {!isMovieInfoSearching && movieInfoResults.length > 1 && (
                  <div className="border-t border-slate-800 pt-4">
                    <p className="text-xs text-slate-400 leading-relaxed mb-3">{t.movieInfoChooseResult}</p>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5">
                      {movieInfoResults.map(movie => {
                        const isSelected = selectedMovieInfo?.id === movie.id;
                        return (
                          <button
                            key={movie.id}
                            type="button"
                            onClick={() => {
                              setSelectedMovieInfo(movie);
                              setExpandedMovieReviewIds({});
                            }}
                            className={`flex min-w-0 items-center gap-2 rounded-lg border p-2 text-left transition-colors ${isSelected ? 'border-teal-400 bg-teal-500/10' : 'border-slate-700 bg-slate-800/40 hover:border-teal-500'}`}
                          >
                            <div className="w-9 h-12 shrink-0 overflow-hidden rounded bg-slate-800 flex items-center justify-center">
                              {movie.poster_path ? (
                                <img
                                  src={buildTmdbPosterUrl(movie.poster_path)}
                                  alt=""
                                  className="w-full h-full object-cover"
                                  loading="lazy"
                                />
                              ) : (
                                <Film className="w-4 h-4 text-slate-600" />
                              )}
                            </div>
                            <span className="min-w-0">
                              <span className="block truncate text-[11px] font-semibold text-slate-200">{movie.title || movie.original_title}</span>
                              <span className="mt-0.5 block text-[10px] text-slate-500">{movie.release_date ? movie.release_date.slice(0, 4) : '-'}</span>
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                <p className="mt-4 text-[10px] text-slate-500 leading-relaxed">{t.tmdbAttribution}</p>
              </div>
            </div>
          )}

          {posterTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-sm px-3 sm:px-4 py-4 animate-in fade-in duration-200">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-6 w-full max-w-3xl max-h-[92vh] overflow-y-auto shadow-2xl animate-in zoom-in-95 duration-200">
                <div className="flex items-start justify-between gap-4 mb-5">
                  <div className="min-w-0">
                    <p className="text-xs text-teal-400 mb-1">{posterDraft.trim() ? t.editPoster : t.addPoster}</p>
                    <h3 className="text-lg font-bold text-white break-words">{posterTarget.movieTitle}</h3>
                    <p className="text-xs text-yellow-400 mt-1">★ {posterTarget.rating}</p>
                  </div>
                  <button
                    type="button"
                    onClick={closePosterEditor}
                    className="text-slate-400 hover:text-white p-1 shrink-0"
                    aria-label={t.cancel}
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="rounded-xl border border-slate-700 bg-slate-800/30 p-3 sm:p-4 mb-4">
                  <label className="block text-xs font-semibold text-teal-400 mb-2">{t.tmdbSearchTitle}</label>
                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="search"
                      value={tmdbQuery}
                      onChange={e => setTmdbQuery(e.target.value)}
                      onKeyDown={e => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          searchTmdbPosters();
                        }
                      }}
                      placeholder={t.tmdbSearchPlaceholder}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                    />
                    <button
                      type="button"
                      onClick={() => searchTmdbPosters()}
                      disabled={isTmdbSearching || !tmdbQuery.trim()}
                      className="sm:w-auto px-4 py-2.5 rounded-lg bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      {isTmdbSearching ? <Loader2 className="w-4 h-4 animate-spin" /> : <Film className="w-4 h-4" />}
                      {isTmdbSearching ? t.tmdbSearching : t.tmdbSearchButton}
                    </button>
                  </div>

                  {tmdbError && (
                    <div className="mt-3 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2.5 text-xs text-amber-300 leading-relaxed">
                      {tmdbError}
                    </div>
                  )}

                  {tmdbResults.length > 0 && (
                    <div className="mt-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2 sm:gap-3">
                      {tmdbResults.map(movie => {
                        const posterUrl = buildTmdbPosterUrl(movie.poster_path);
                        const isSelected = posterDraft === posterUrl;
                        const releaseYear = movie.release_date ? movie.release_date.slice(0, 4) : t.tmdbReleaseUnknown;
                        return (
                          <button
                            key={movie.id}
                            type="button"
                            onClick={() => selectTmdbPoster(movie)}
                            className={`relative overflow-hidden rounded-lg border text-left transition-all ${isSelected ? 'border-teal-400 ring-2 ring-teal-400/50' : 'border-slate-700 hover:border-teal-500'}`}
                            title={`${movie.title || movie.original_title} (${releaseYear})`}
                          >
                            <img
                              src={posterUrl}
                              alt={`${movie.title || movie.original_title} poster`}
                              className="w-full aspect-[2/3] object-cover bg-slate-800"
                              loading="lazy"
                            />
                            <span className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent px-1.5 pt-7 pb-1.5">
                              <span className="block text-[9px] sm:text-[10px] leading-tight font-semibold text-white line-clamp-2">{movie.title || movie.original_title}</span>
                              <span className="block mt-0.5 text-[8px] sm:text-[9px] text-slate-300">{releaseYear}</span>
                            </span>
                            {isSelected && (
                              <span className="absolute top-1 right-1 rounded-full bg-teal-500 px-1.5 py-0.5 text-[8px] font-bold text-slate-950 shadow-lg">
                                {t.tmdbSelected}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-[180px_1fr] gap-4 items-start">
                  <div>
                    <p className="text-xs text-slate-400 mb-1.5">{t.posterPreview}</p>
                    <div className="rounded-xl overflow-hidden border border-slate-700 bg-slate-950 min-h-[240px] flex items-center justify-center">
                      {posterDraft.trim() ? (
                        <img
                          src={posterDraft.trim()}
                          alt={t.posterPreview}
                          className="w-full max-h-[360px] object-contain"
                          referrerPolicy="no-referrer"
                        />
                      ) : (
                        <span className="px-4 text-center text-xs text-slate-500">{t.tmdbSearchTitle}</span>
                      )}
                    </div>
                  </div>

                  <form onSubmit={savePosterUrl} className="space-y-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1.5">{t.posterUrl}</label>
                      <input
                        type="url"
                        value={posterDraft}
                        onChange={e => setPosterDraft(e.target.value)}
                        placeholder="https://..."
                        className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                      />
                    </div>

                    <button
                      type="button"
                      onClick={() => openGoogleImageSearch(posterTarget.movieTitle)}
                      className="w-full bg-slate-800 border border-slate-700 hover:border-teal-400 hover:text-teal-400 px-3 py-2.5 rounded-lg text-sm transition-colors flex items-center justify-center gap-2"
                    >
                      <Globe className="w-4 h-4" /> {t.imageSearch}
                    </button>

                    <div className="rounded-lg bg-slate-800/50 border border-slate-700/60 p-3">
                      <p className="text-[11px] text-slate-400 leading-relaxed">{t.posterGuide}</p>
                      {t.posterLocalOnly && <p className="text-[11px] text-amber-400/80 leading-relaxed mt-1">{t.posterLocalOnly}</p>}
                      <p className="text-[10px] text-slate-500 leading-relaxed mt-2">{t.tmdbAttribution}</p>
                    </div>

                    <div className="flex flex-col-reverse sm:flex-row justify-between gap-2 pt-1">
                      <div>
                        {getPosterUrl(posterTarget) && (
                          <button
                            type="button"
                            onClick={removePosterUrl}
                            disabled={isSubmitting}
                            className="w-full sm:w-auto px-4 py-2 text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg hover:bg-red-500/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                          >
                            {t.removePoster}
                          </button>
                        )}
                      </div>
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={closePosterEditor}
                          disabled={isSubmitting}
                          className="flex-1 sm:flex-none px-4 py-2 text-sm bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                          {t.cancel}
                        </button>
                        <button
                          type="submit"
                          disabled={isSubmitting || !posterDraft.trim()}
                          className="flex-1 sm:flex-none px-4 py-2 text-sm bg-teal-500 text-slate-950 font-bold rounded-lg hover:bg-teal-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                        >
                          {isSubmitting ? <Loader2 className="w-4 h-4 animate-spin" /> : null}
                          {t.save}
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* ✨ 삭제 확인 모달 (팝업) ✨ */}
          {itemToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm px-4 animate-in fade-in duration-200">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-in zoom-in-95 duration-200">
                <h3 className="text-lg font-bold text-white mb-3 flex items-center gap-2">
                  <Trash2 className="w-5 h-5 text-red-500" />
                  {appLang === 'ko' ? '삭제 확인' : '削除の確認'}
                </h3>
                <p className="text-sm text-slate-300 mb-6 whitespace-pre-wrap">{t.deleteConfirm}</p>
                <div className="flex justify-end gap-3">
                  <button
                    onClick={() => setItemToDelete(null)}
                    disabled={isSubmitting}
                    className="px-4 py-2 text-sm bg-slate-800 text-slate-300 font-medium rounded-lg hover:bg-slate-700 transition-colors"
                  >
                    {t.no}
                  </button>
                  <button
                    onClick={executeDelete}
                    disabled={isSubmitting}
                    className="px-4 py-2 text-sm bg-red-500 text-white font-bold rounded-lg hover:bg-red-600 transition-colors flex items-center gap-2"
                  >
                    {isSubmitting ? <Loader2 className="w-4 h-4 animate-spin" /> : null}
                    {t.yes}
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // React 앱을 화면에 그립니다.
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
