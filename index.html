<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617" id="theme-color-meta">
  <title>Movie Log</title>
  
  <!-- Tailwind CSS (디자인) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel (화면 및 기능 구동) -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- 안정적인 Babel 버전으로 고정하여 컴파일 오류 방지 -->
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>

  <style>
    html, body {
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 밝은 테마: 따뜻한 아이보리 배경 + 차분한 인디고 포인트 */
    body.light-theme {
      background-color: #f6f4ef !important;
      color: #292d3c !important;
    }

    body.light-theme .bg-slate-950 { background-color: #f6f4ef !important; }
    body.light-theme .bg-slate-950\/45 { background-color: rgba(239, 238, 242, 0.82) !important; }

    body.light-theme .bg-slate-900 { background-color: #fffdfa !important; }
    body.light-theme .bg-slate-900\/30 { background-color: rgba(255, 253, 250, 0.60) !important; }
    body.light-theme .bg-slate-900\/50 { background-color: rgba(255, 253, 250, 0.84) !important; }
    body.light-theme .bg-slate-900\/70 { background-color: rgba(255, 253, 250, 0.95) !important; }

    body.light-theme .bg-slate-800 { background-color: #eff0f5 !important; }
    body.light-theme .bg-slate-800\/30 { background-color: rgba(226, 228, 237, 0.48) !important; }
    body.light-theme .bg-slate-800\/40 { background-color: rgba(226, 228, 237, 0.60) !important; }
    body.light-theme .bg-slate-800\/50 { background-color: rgba(226, 228, 237, 0.72) !important; }
    body.light-theme .bg-slate-800\/80 { background-color: rgba(226, 228, 237, 0.92) !important; }
    body.light-theme .bg-slate-700 { background-color: #e0e2eb !important; }
    body.light-theme .bg-slate-600 { background-color: #cfd2df !important; }

    body.light-theme .border-slate-800,
    body.light-theme .border-slate-800\/80 { border-color: #dedfe7 !important; }
    body.light-theme .border-slate-700,
    body.light-theme .border-slate-700\/50,
    body.light-theme .border-slate-700\/60,
    body.light-theme .border-slate-700\/70,
    body.light-theme .border-slate-700\/80 { border-color: #d0d3df !important; }
    body.light-theme .border-slate-600 { border-color: #bec2d0 !important; }

    body.light-theme .text-white,
    body.light-theme .text-slate-100,
    body.light-theme .text-slate-200 { color: #292d3c !important; }
    body.light-theme .text-slate-300 { color: #3f4455 !important; }
    body.light-theme .text-slate-400 { color: #64697a !important; }
    body.light-theme .text-slate-500 { color: #818696 !important; }
    body.light-theme .text-slate-600 { color: #9da1ad !important; }

    /* 다크 테마의 청록 계열을 밝은 테마에서는 뮤트 인디고로 치환 */
    body.light-theme .text-teal-300,
    body.light-theme .text-teal-400,
    body.light-theme .text-teal-500,
    body.light-theme .text-teal-400\/80 { color: #5664a8 !important; }
    body.light-theme .hover\:text-teal-400:hover,
    body.light-theme .group:hover .group-hover\:text-teal-400 { color: #48569b !important; }

    body.light-theme .text-yellow-400 { color: #9c6a18 !important; }
    body.light-theme .fill-yellow-400 { fill: #d79a2b !important; }
    body.light-theme .text-gray-600 { color: #b4b7c2 !important; }

    body.light-theme .bg-teal-400,
    body.light-theme .bg-teal-500 { background-color: #5967aa !important; }
    body.light-theme .hover\:bg-teal-400:hover,
    body.light-theme .hover\:bg-teal-500:hover { background-color: #6876ba !important; }
    body.light-theme .bg-teal-400\/20 { background-color: #e7e9f7 !important; }
    body.light-theme .bg-teal-400\/5,
    body.light-theme .bg-teal-500\/5 { background-color: rgba(89, 103, 170, 0.08) !important; }
    body.light-theme .bg-teal-500\/20,
    body.light-theme .group:hover .group-hover\:bg-teal-500\/20 { background-color: rgba(89, 103, 170, 0.15) !important; }

    body.light-theme .border-teal-400,
    body.light-theme .border-teal-500,
    body.light-theme .hover\:border-teal-400:hover,
    body.light-theme .hover\:border-teal-500:hover { border-color: #6471b4 !important; }
    body.light-theme .border-teal-400\/40,
    body.light-theme .border-teal-500\/40 { border-color: rgba(89, 103, 170, 0.38) !important; }
    body.light-theme .hover\:border-teal-500\/50:hover { border-color: rgba(89, 103, 170, 0.55) !important; }
    body.light-theme .hover\:ring-teal-400\/50:hover { --tw-ring-color: rgba(89, 103, 170, 0.42) !important; }

    body.light-theme .bg-teal-500.text-slate-950,
    body.light-theme .bg-teal-500.text-slate-900,
    body.light-theme button.bg-teal-500,
    body.light-theme span.bg-teal-500 { color: #ffffff !important; }

    body.light-theme .hover\:bg-slate-800\/50:hover { background-color: rgba(224, 226, 235, 0.76) !important; }
    body.light-theme .hover\:bg-slate-700:hover { background-color: #d8dae5 !important; }
    body.light-theme .hover\:bg-slate-600:hover { background-color: #c9ccd9 !important; }
    body.light-theme .hover\:text-white:hover,
    body.light-theme .group:hover .group-hover\:text-white { color: #202433 !important; }

    body.light-theme input,
    body.light-theme textarea,
    body.light-theme select {
      color-scheme: light;
      background-color: #f4f4f8 !important;
      border-color: #d0d3df !important;
      color: #303443 !important;
    }

    body.light-theme input:focus,
    body.light-theme textarea:focus,
    body.light-theme select:focus,
    body.light-theme .focus\:border-teal-400:focus {
      background-color: #fffdfa !important;
      border-color: #6673b7 !important;
      box-shadow: 0 0 0 1px rgba(102, 115, 183, 0.20) !important;
    }

    body.light-theme .focus\:ring-teal-500:focus {
      --tw-ring-color: rgba(102, 115, 183, 0.30) !important;
    }

    body.light-theme input[type="range"] {
      accent-color: #5967aa !important;
    }

    body.light-theme input::placeholder,
    body.light-theme textarea::placeholder {
      color: #9a9eaa;
    }

    body.light-theme ::selection {
      background-color: #5967aa;
      color: #ffffff;
    }

    /* 포스터와 위험 버튼은 밝은 테마에서도 원래 대비를 유지 */
    body.light-theme .poster-card .text-white { color: #ffffff !important; }
    body.light-theme .album-movie-title { color: #ffffff !important; }
    body.light-theme .board-subnav button,
    body.light-theme .board-subnav button svg { color: #ffffff !important; }
    body.light-theme button.bg-red-500.text-white { color: #ffffff !important; }

    body.light-theme .shadow-sm,
    body.light-theme .shadow-lg,
    body.light-theme .shadow-xl,
    body.light-theme .shadow-2xl {
      --tw-shadow-color: rgba(46, 50, 82, 0.10);
    }

    body.light-theme header.bg-slate-900 {
      background-color: rgba(255, 253, 250, 0.96) !important;
      backdrop-filter: blur(14px);
    }

    /* 영화 정보 모달의 Movie Log 평가 영역은 밝은 테마에서 별도 대비를 확보 */
    body.light-theme .movie-log-rating-panel {
      background-color: #eceef5 !important;
      border-color: #c8ccda !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    body.light-theme .movie-log-average-box {
      background-color: #fffaf0 !important;
      border-color: #d8bd78 !important;
    }

    body.light-theme .movie-log-review-card {
      background-color: #fffdfa !important;
      border-color: #cfd3df !important;
      box-shadow: 0 1px 2px rgba(46, 50, 82, 0.06);
    }

    body.light-theme .movie-log-review-card .movie-log-review-name {
      color: #292d3c !important;
    }

    body.light-theme .movie-log-review-score {
      background-color: #fff6df !important;
      border-color: #d8b65f !important;
      color: #8a5b08 !important;
    }

    body.light-theme .movie-log-review-score:hover {
      background-color: #ffefc7 !important;
      border-color: #c99a2e !important;
    }

    body.light-theme .movie-log-review-detail {
      background-color: #f5f5f9 !important;
      border-color: #cfd3df !important;
    }

    body.light-theme .movie-log-review-detail .text-slate-300,
    body.light-theme .movie-log-review-detail .text-slate-400 {
      color: #3f4455 !important;
    }

    body.light-theme .movie-log-review-detail .text-slate-500 {
      color: #6d7282 !important;
    }


    /* 일본어 모바일 화면에서 긴 문구와 리뷰가 가로로 넘치지 않도록 제한 */
    html, body, #root {
      max-width: 100%;
      overflow-x: hidden;
    }

    .mobile-width-safe,
    .mobile-width-safe * {
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    .mobile-break-anywhere,
    .mobile-break-anywhere * {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    @media (max-width: 639px) {
      .movie-log-review-card,
      .movie-log-review-detail,
      .movie-log-rating-panel,
      .review-card-safe {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        overflow-x: hidden;
      }

      .review-card-safe,
      .review-card-safe * {
        min-width: 0;
        box-sizing: border-box;
      }

      .review-card-safe .review-card-head {
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      .movie-title-button {
        display: flex !important;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
      }

      .movie-title-button .movie-title-text {
        flex: 1 1 0%;
        min-width: 0;
        max-width: 100%;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-all;
      }

      .review-card-safe textarea,
      .review-card-safe input,
      .review-card-safe select,
      .review-card-safe form,
      .review-card-safe label,
      .review-card-safe h3,
      .review-card-safe h4,
      .review-card-safe span,
      .review-card-safe div {
        max-width: 100%;
      }

      .review-card-safe .whitespace-pre-wrap,
      .movie-log-review-detail,
      .movie-log-review-detail * {
        overflow-wrap: anywhere;
        word-break: break-all;
      }
    }


    /* ---------------------------------------------------------------------- */
    /* Genre Taste / Cinema DNA                                               */
    /* ---------------------------------------------------------------------- */
    .genre-taste-shell {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .genre-taste-shell::before {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      right: -110px;
      top: -130px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.18), transparent 68%);
      pointer-events: none;
      z-index: -1;
    }

    .genre-film-perforation {
      background-image: radial-gradient(circle, rgba(148, 163, 184, 0.42) 1.2px, transparent 1.4px);
      background-size: 11px 11px;
      background-position: center;
    }

    .genre-donut {
      position: relative;
      border-radius: 9999px;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.34), inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .genre-donut::after {
      content: '';
      position: absolute;
      inset: 17%;
      border-radius: 9999px;
      background: #0f172a;
      border: 1px solid rgba(71, 85, 105, 0.8);
      box-shadow: inset 0 8px 22px rgba(2, 6, 23, 0.42);
    }

    .genre-donut-label {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    body.light-theme .genre-taste-shell::before {
      background: radial-gradient(circle, rgba(89, 103, 170, 0.16), transparent 68%);
    }

    body.light-theme .genre-donut::after {
      background: #fffdfa;
      border-color: #d0d3df;
      box-shadow: inset 0 8px 22px rgba(46, 50, 82, 0.08);
    }

    body.light-theme .genre-film-perforation {
      background-image: radial-gradient(circle, rgba(89, 103, 170, 0.32) 1.2px, transparent 1.4px);
    }

    /* 장르 취향 코멘트 영역: 밝은 테마 전용 대비 보정 */
    body.light-theme .genre-persona-card {
      background: linear-gradient(145deg, #fbfaf7 0%, #f4f5fb 100%) !important;
      border-color: #c8cede !important;
      box-shadow: 0 12px 28px rgba(46, 50, 82, 0.08);
    }

    body.light-theme .genre-persona-badge {
      background-color: #eceefa !important;
      border-color: #c4cae5 !important;
      color: #4f5d9f !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
    }

    body.light-theme .genre-axis-card {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    body.light-theme .genre-axis-card-primary {
      background-color: #eef7f5 !important;
      border-color: #bddbd5 !important;
    }

    body.light-theme .genre-axis-card-secondary {
      background-color: #f1f0fa !important;
      border-color: #ccc8e4 !important;
    }

    body.light-theme .genre-axis-card-primary .genre-axis-name {
      color: #24796f !important;
    }

    body.light-theme .genre-axis-card-secondary .genre-axis-name {
      color: #665aa0 !important;
    }

    body.light-theme .genre-axis-score {
      color: #292d3c !important;
    }

    body.light-theme .genre-axis-genres {
      color: #676c7c !important;
    }

    body.light-theme .genre-axis-description {
      color: #3f4455 !important;
    }

    body.light-theme .genre-insight-card {
      background-color: #fffdfa !important;
      border-color: #d4d7e1 !important;
      box-shadow: 0 1px 2px rgba(46, 50, 82, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    body.light-theme .genre-insight-card p:last-child {
      color: #3b4050 !important;
    }

    body.light-theme .genre-insight-title-01 {
      color: #397d76 !important;
    }

    body.light-theme .genre-insight-title-02 {
      color: #665aa0 !important;
    }

    body.light-theme .genre-insight-title-03 {
      color: #95671d !important;
    }

    /* 감상시간·키워드 분석 카드의 밝은 테마 대비 */
    body.light-theme .text-indigo-300 { color: #665aa0 !important; }
    body.light-theme .text-amber-300 { color: #95671d !important; }
    body.light-theme .text-teal-300 { color: #24796f !important; }
    body.light-theme .bg-indigo-400\/5 { background-color: rgba(102, 90, 160, 0.08) !important; }
    body.light-theme .border-indigo-400\/25 { border-color: rgba(102, 90, 160, 0.32) !important; }
    body.light-theme .bg-amber-400\/5 { background-color: rgba(149, 103, 29, 0.08) !important; }
    body.light-theme .border-amber-400\/25 { border-color: rgba(149, 103, 29, 0.30) !important; }
    body.light-theme .bg-teal-400\/5 { background-color: rgba(36, 121, 111, 0.08) !important; }
    body.light-theme .border-teal-400\/25 { border-color: rgba(36, 121, 111, 0.30) !important; }


    /* 모든 화면에서 도넛을 상단 중앙에 배치합니다. */




    /* ---------------------------------------------------------------------- */
    /* Random Movie Picker                                                     */
    /* ---------------------------------------------------------------------- */
    @keyframes random-picker-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes random-picker-glow {
      0%, 100% { box-shadow: 0 14px 34px rgba(20, 184, 166, 0.24); }
      50% { box-shadow: 0 18px 44px rgba(20, 184, 166, 0.40); }
    }

    @keyframes random-poster-swap {
      0% {
        opacity: 0.45;
        transform: scale(0.92) rotate(-1.5deg);
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter: blur(0);
      }
    }

    @keyframes random-reel-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes random-result-pop {
      0% { opacity: 0; transform: scale(0.94) translateY(8px); }
      70% { transform: scale(1.02) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .random-picker-fab {
      animation: random-picker-float 2.8s ease-in-out infinite,
                 random-picker-glow 2.8s ease-in-out infinite;
    }

    .random-picker-poster-swap {
      animation: random-poster-swap 0.18s ease-out both;
    }

    .random-picker-reel-spin {
      animation: random-reel-spin 0.8s linear infinite;
    }

    .random-picker-result-pop {
      animation: random-result-pop 0.36s ease-out both;
    }

    body.light-theme .random-picker-fab {
      box-shadow: 0 14px 32px rgba(89, 103, 170, 0.28);
    }

    @media (prefers-reduced-motion: reduce) {
      .random-picker-fab,
      .random-picker-poster-swap,
      .random-picker-reel-spin,
      .random-picker-result-pop {
        animation: none !important;
      }
    }

  </style>
</head>

    const calculateWeek = (dateString) => {
      const targetDate = new Date(dateString + 'T00:00:00Z');
      const diffTime = targetDate - START_DATE;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const week = Math.floor(diffDays / 7) + 1;
      return week > 0 ? week : 1;
    };

     if (isNaN(d.getTime())) return dateString.split('T')[0];

     return kst.toISOString().split('T')[0];
    };

    const TMDB_MOVIE_GENRE_IDS = [
      12, 14, 16, 18, 27, 28, 35, 36, 37, 53,

    ];
    const TMDB_MOVIE_GENRE_ID_SET = new Set(TMDB_MOVIE_GENRE_IDS);

    const splitConcatenatedGenreIds = (value) => {
      const digits = String(value ?? '').replace(/\.0+$/, '').replace(/\D/g, '');
      if (!digits) return [];

      const directNumber = Number(digits);
      if (TMDB_MOVIE_GENRE_ID_SET.has(directNumber)) return [directNumber];

      const candidates = [...TMDB_MOVIE_GENRE_IDS]
        .map(String)
        .sort((a, b) => b.length - a.length);
      const memo = new Map();

      const solve = (index) => {
        if (index === digits.length) return [];
        if (memo.has(index)) return memo.get(index);

        let best = null;
        for (const candidate of candidates) {
          if (!digits.startsWith(candidate, index)) continue;
          const rest = solve(index + candidate.length);
          if (rest === null) continue;

          const combined = [Number(candidate), ...rest];
          if (!best || combined.length > best.length) best = combined;
        }

        memo.set(index, best);
        return best;
      };

      return solve(0) || [];
    };

        try {

        } catch (e) {
          values = /[,|;\s]/.test(raw)
            ? raw.split(/[,|;\s]+/)

        }
      }

      const normalized = [];
      values.forEach(item => {

        if (!rawItem) return;

        const number = Number(rawItem);
        if (!Number.isFinite(number)) return;

          return;

      'imagination-reality': {

        jp: { title: '現実世界を異なる視点で見直す思索家', description: '現実を記録しながら、当然だと思っていたルールを別の視点から反転させる映画を好みます。' }
      },
      'movement-warmth': {
        ko: { title: '함께 달리고 함께 웃는 팀플레이 애호가', description: '혼자 완성되는 영웅보다 서로 부딪치고 돌보며 하나의 팀이 되는 과정을 즐겨요.' },
        jp: { title: '共に走り、共に笑うチームプレー好き', description: '一人で完成する英雄より、ぶつかり合い、支え合いながら一つのチームになる過程を楽しみます。' }
      },
      'movement-reality': {
        ko: { title: '역사의 현장을 통과하는 행동파 기록자', description: '시대와 사건을 멀리서 설명하기보다 그 안을 직접 통과하는 인물의 시선으로 체험하고 싶어 해요.' },
        jp: { title: '歴史の現場を通過する行動派の記録者', description: '時代や事件を遠くから説明するより、その中を進む人物の視点で体験したいタイプです。' }
      },
      'reality-warmth': {
        ko: { title: '평범한 삶의 다정함을 발견하는 생활 관찰자', description: '거창한 사건 없이도 일상 속 유머와 돌봄이 한 사람의 삶을 지탱하는 순간을 알아봐요.' },
        jp: { title: '平凡な暮らしの優しさを見つける生活の観察者', description: '大きな事件がなくても、日常のユーモアや気遣いが人の人生を支える瞬間を見つけます。' }
      }
    };

    const getGenreTasteAxis = (genreId) =>
      GENRE_TASTE_AXES.find(axis => axis.genreIds.includes(Number(genreId))) || null;

    const buildGenrePersona = (genres, nickname, currentUser, language, averageRating = 0, userReviews = []) => {
      const top = genres?.[0];
      if (!top) return { title: '', summary: '', discovery: '', style: '', badges: [] };

      const second = genres?.[1] || null;
      const third = genres?.[2] || null;
      const isSelf = nickname === currentUser;
      const subject = language === 'ko'
        ? (isSelf ? '당신은' : `${nickname}님은`)
        : (isSelf ? 'あなたは' : `${nickname}さんは`);

      const topPercentage = Number(top.percentage || 0);
      const secondPercentage = Number(second?.percentage || 0);
      const thirdPercentage = Number(third?.percentage || 0);
      const secondIsMeaningful = !!second && secondPercentage >= Math.max(6, topPercentage * 0.20);
      const thirdIsMeaningful = !!third && thirdPercentage >= Math.max(5, topPercentage * 0.18);

      // 장르별 비율을 여섯 개의 큰 취향 축으로 다시 합산합니다.
      const axisScores = GENRE_TASTE_AXES.map(axis => ({
        ...axis,
        score: genres.reduce((sum, genre) =>
          sum + (axis.genreIds.includes(Number(genre.id)) ? Number(genre.percentage || 0) : 0), 0)
      })).filter(axis => axis.score > 0)
        .sort((a, b) => b.score - a.score);

      const primaryAxis = axisScores[0] || getGenreTasteAxis(top.id);
      const secondaryAxis = axisScores[1] || null;
      const secondaryAxisMeaningful = !!secondaryAxis && secondaryAxis.score >= Math.max(8, Number(primaryAxis?.score || 0) * 0.25);

      const genrePairKey = secondIsMeaningful
        ? [Number(top.id), Number(second.id)].sort((a, b) => a - b).join('-')
        : '';
      const genrePairPersona = genrePairKey ? GENRE_PAIR_PERSONAS[genrePairKey]?.[language] : null;
      const axisPairKey = secondaryAxisMeaningful
        ? [primaryAxis.id, secondaryAxis.id].sort().join('-')
        : '';
      const axisPairPersona = axisPairKey ? GENRE_AXIS_PAIR_PERSONAS[axisPairKey]?.[language] : null;
      const primaryAxisCopy = primaryAxis?.[language] || null;

      const typeCopy = genrePairPersona || axisPairPersona || primaryAxisCopy || {
        title: language === 'ko' ? `${top.name} 취향 수집가` : `${top.name}の好みを集める人`,
        description: GENRE_PERSONA_COPY[top.id]?.[language] || (language === 'ko'
          ? '영화를 거듭 볼수록 자신만의 분명한 기준을 만들어가고 있어요.'
          : '映画を重ねて観るほど、自分だけの明確な基準を作っています。')
      };

      const title = language === 'ko'
        ? `${subject} ${typeCopy.title}`
        : `${subject}${typeCopy.title}`;

      let summary = typeCopy.description;
      if (primaryAxis && secondaryAxisMeaningful) {
        const primaryCopy = primaryAxis[language];
        const secondaryCopy = secondaryAxis[language];
        summary += language === 'ko'
          ? ` 장르를 비슷한 감상 성향끼리 묶어 보면, ‘${primaryCopy.name}’은 ${primaryCopy.genres}처럼 ${primaryCopy.short}를 선호하는 성향이며 ${Math.round(primaryAxis.score)}%예요. ‘${secondaryCopy.name}’은 ${secondaryCopy.genres}처럼 ${secondaryCopy.short}를 선호하는 성향이며 ${Math.round(secondaryAxis.score)}%로 두 번째 축을 이루고 있어요.`
          : ` ジャンルを近い鑑賞傾向ごとにまとめると、「${primaryCopy.name}」は${primaryCopy.genres}のような、${primaryCopy.short}を指し、${Math.round(primaryAxis.score)}%です。「${secondaryCopy.name}」は${secondaryCopy.genres}のような、${secondaryCopy.short}を指し、${Math.round(secondaryAxis.score)}%で二つ目の軸になっています。`;
      } else if (primaryAxis) {
        const primaryCopy = primaryAxis[language];
        summary += language === 'ko'
          ? ` 장르를 비슷한 감상 성향끼리 묶어 보면, ‘${primaryCopy.name}’이 ${Math.round(primaryAxis.score)}%로 가장 높아요. 이는 ${primaryCopy.genres}처럼 ${primaryCopy.short}를 자주 선택한다는 뜻이에요.`
          : ` ジャンルを近い鑑賞傾向ごとにまとめると、「${primaryCopy.name}」が${Math.round(primaryAxis.score)}%で最も高くなっています。これは${primaryCopy.genres}のような、${primaryCopy.short}をよく選んでいるという意味です。`;
      }

      // 개별 리뷰의 장르별 평균 별점을 계산해, 많이 본 장르와 사랑한 장르를 구분합니다.
      const genreRatingMap = new Map();
      const validRatings = [];
      (userReviews || []).forEach(review => {
        const rating = Number(review?.rating);
        if (!Number.isFinite(rating)) return;
        validRatings.push(rating);
        parseGenreIds(review?.genreIds).forEach(id => {
          const current = genreRatingMap.get(Number(id)) || { sum: 0, count: 0 };
          current.sum += rating;
          current.count += 1;
          genreRatingMap.set(Number(id), current);
        });
      });

      const genreNameMap = new Map(genres.map(genre => [Number(genre.id), genre.name]));
      let ratedCandidates = Array.from(genreRatingMap.entries()).map(([id, value]) => ({
        id,
        name: genreNameMap.get(id) || `Genre ${id}`,
        average: value.count ? value.sum / value.count : 0,
        count: value.count
      }));
      const stableCandidates = ratedCandidates.filter(item => item.count >= 2);
      if (stableCandidates.length > 0) ratedCandidates = stableCandidates;
      ratedCandidates.sort((a, b) => b.average - a.average || b.count - a.count);
      const bestRatedGenre = ratedCandidates[0] || null;
      const topRatedData = genreRatingMap.get(Number(top.id));
      const topGenreAverage = topRatedData?.count ? topRatedData.sum / topRatedData.count : 0;

      let discovery = '';
      if (bestRatedGenre && bestRatedGenre.id !== Number(top.id)) {
        discovery = language === 'ko'
          ? `가장 자주 본 장르는 ${top.name}지만, 가장 높은 평균 별점을 받은 장르는 ${bestRatedGenre.name} ${bestRatedGenre.average.toFixed(1)}점이에요. 자주 찾는 익숙한 취향과 실제로 마음을 크게 빼앗기는 지점이 조금 다른 편이에요.`
          : `最もよく観ているのは${top.name}ですが、平均評価が最も高いのは${bestRatedGenre.name}の${bestRatedGenre.average.toFixed(1)}です。よく選ぶ親しみのある好みと、強く心を奪われるポイントが少し異なります。`;
      } else if (bestRatedGenre && bestRatedGenre.id === Number(top.id)) {
        discovery = language === 'ko'
          ? `${top.name}는 가장 자주 본 장르이면서 평균 ${bestRatedGenre.average.toFixed(1)}점으로 가장 높게 평가한 장르이기도 해요. 반복해서 찾는 빈도와 애정이 같은 방향을 가리키고 있어요.`
          : `${top.name}は最もよく観るジャンルであり、平均${bestRatedGenre.average.toFixed(1)}で最も高く評価したジャンルでもあります。選ぶ頻度と愛情が同じ方向を向いています。`;
      } else if (secondIsMeaningful) {
        discovery = language === 'ko'
          ? `${top.name} ${Math.round(topPercentage)}%가 가장 큰 비중을 차지하지만, ${second.name}도 ${Math.round(secondPercentage)}%로 뚜렷하게 따라오고 있어요.${thirdIsMeaningful ? ` ${third.name} ${Math.round(thirdPercentage)}%까지 더해져 한 단어로 설명하기 어려운 취향이에요.` : ''}`
          : `${top.name}が${Math.round(topPercentage)}%で最も大きい一方、${second.name}も${Math.round(secondPercentage)}%とはっきり続いています。${thirdIsMeaningful ? ` ${third.name}の${Math.round(thirdPercentage)}%も加わり、一言では説明しにくい好みです。` : ''}`;
      } else {
        discovery = language === 'ko'
          ? `${top.name}의 비중이 ${Math.round(topPercentage)}%로 가장 선명해요. 여러 장르를 오가더라도 결국 이 장르가 가진 감각으로 돌아오는 편이에요.`
          : `${top.name}の割合が${Math.round(topPercentage)}%で最もはっきりしています。さまざまなジャンルを行き来しても、最後にはこのジャンルの感覚へ戻るタイプです。`;
      }

      // 장르 집중도 판정
      const topThreeSum = topPercentage + secondPercentage + thirdPercentage;
      const gap = second ? topPercentage - secondPercentage : topPercentage;
      let focusType = 'layered';
      if (genres.length >= 8 && topPercentage < 25 && topThreeSum < 58) focusType = 'explorer';
      else if (second && Math.abs(gap) <= 4) focusType = 'balanced';
      else if (topPercentage >= 36 && gap >= 10) focusType = 'focused';

      const focusCopy = {
        focused: {
          ko: { label: '선명한 집중형', text: `좋아하는 결이 확실한 편이에요. ${top.name}를 중심으로 영화를 고르되, 안전한 선택이라기보다 자신이 원하는 감정을 정확히 알고 있는 쪽에 가까워요.` },
          jp: { label: 'はっきり集中型', text: `好みの輪郭が明確です。${top.name}を中心に選びますが、安全な選択というより、自分が求める感情を正確に知っているタイプです。` }
        },
        balanced: {
          ko: { label: '두 축 균형형', text: `${top.name}와 ${second?.name || ''}의 비중이 거의 같아요. 한쪽으로 고정되기보다 영화마다 다른 감각을 오가며 두 취향을 균형 있게 유지하고 있어요.` },
          jp: { label: '二軸バランス型', text: `${top.name}と${second?.name || ''}の割合がほぼ同じです。一方に固定されず、作品ごとに異なる感覚を行き来しながら二つの好みを保っています。` }
        },
        explorer: {
          ko: { label: '장르 탐험형', text: '한 장르에 오래 머무르기보다 아직 보지 못한 감각을 찾아 이동하는 편이에요. 취향을 좁히기보다 자신만의 영화 지도를 넓혀가고 있어요.' },
          jp: { label: 'ジャンル探検型', text: 'ひとつのジャンルに留まるより、まだ知らない感覚を探して移動するタイプです。好みを狭めるより、自分だけの映画地図を広げています。' }
        },
        layered: {
          ko: { label: '다층 취향형', text: '분명한 중심 장르는 있지만 2·3위 장르도 꾸준히 함께 나타나요. 하나의 분위기보다 여러 감정과 장르가 겹쳐지는 영화를 좋아하는 편이에요.' },
          jp: { label: '多層的な好み', text: '明確な中心ジャンルはありますが、二位・三位のジャンルも継続して表れています。一つの雰囲気より、複数の感情やジャンルが重なる映画を好みます。' }
        }
      }[focusType][language];

      // 평점 분포 판정
      const rating = Number(averageRating || 0);
      const ratingCount = validRatings.length;
      const highShare = ratingCount ? validRatings.filter(value => value >= 4.5).length / ratingCount : 0;
      const lowShare = ratingCount ? validRatings.filter(value => value <= 2.5).length / ratingCount : 0;
      const middleShare = ratingCount ? validRatings.filter(value => value >= 3.5 && value <= 4.5).length / ratingCount : 0;
      let ratingType = 'measured';
      if (ratingCount >= 6 && highShare >= 0.22 && lowShare >= 0.12) ratingType = 'polarized';
      else if (rating >= 4.15) ratingType = 'generous';
      else if (rating > 0 && rating <= 3.2) ratingType = 'strict';
      else if (ratingCount >= 5 && middleShare >= 0.68) ratingType = 'steady';

      const ratingCopy = {
        polarized: {
          ko: { label: '극명한 반응형', text: '애매하게 괜찮은 영화보다 사랑하거나 실망할 수 있는 영화를 선호해요. 감상에 온도 차가 크고, 마음을 움직인 작품에는 확실하게 반응하는 편이에요.' },
          jp: { label: '反応くっきり型', text: '無難に良い映画より、愛したり失望したりできる映画を好みます。鑑賞の温度差が大きく、心を動かした作品には明確に反応します。' }
        },
        generous: {
          ko: { label: '애정 표현형', text: `평균 별점이 ${rating.toFixed(1)}점으로 높은 편이에요. 완벽하지 않아도 마음에 남은 장면과 좋아할 지점을 먼저 발견하는 관객에 가까워요.` },
          jp: { label: '愛情表現型', text: `平均評価は${rating.toFixed(1)}と高めです。完璧でなくても、心に残る場面や好きになれる点を先に見つける観客に近いです。` }
        },
        strict: {
          ko: { label: '엄격한 감식형', text: `평균 별점이 ${rating.toFixed(1)}점으로 비교적 엄격해요. 재미있게 본 것과 좋은 영화라고 판단하는 것을 분리해서 기록하는 편이에요.` },
          jp: { label: '厳密な鑑識型', text: `平均評価は${rating.toFixed(1)}と比較的厳しめです。楽しんだことと、良い映画だと判断することを分けて記録するタイプです。` }
        },
        steady: {
          ko: { label: '완성도 균형형', text: '별점이 중상위 구간에 안정적으로 모여 있어요. 한 장면의 강렬함만 보기보다 영화 전체의 리듬과 완성도를 균형 있게 판단하는 편이에요.' },
          jp: { label: '完成度バランス型', text: '評価が中上位の範囲に安定して集まっています。一場面の強さだけでなく、映画全体のリズムや完成度をバランスよく判断します。' }
        },
        measured: {
          ko: { label: '신중한 평가형', text: rating > 0 ? `평균 별점은 ${rating.toFixed(1)}점이에요. 좋아하는 장르라도 작품마다 다른 기준으로 살펴보며 쉽게 한쪽으로 치우치지 않는 편이에요.` : '장르 취향은 나타나지만 아직 평점 기록이 충분하지 않아 평가 스타일은 조금 더 쌓인 뒤 선명해질 것 같아요.' },
          jp: { label: '慎重な評価型', text: rating > 0 ? `平均評価は${rating.toFixed(1)}です。好きなジャンルでも作品ごとに異なる基準で見つめ、簡単には一方へ偏らないタイプです。` : 'ジャンルの好みは表れていますが、評価記録がまだ少ないため、評価スタイルはもう少し記録が増えると明確になりそうです。' }
        }
      }[ratingType][language];

      const style = `${focusCopy.text} ${ratingCopy.text}`;
      const axisDetails = [
        primaryAxis,
        secondaryAxisMeaningful ? secondaryAxis : null
      ].filter(Boolean).map(axis => ({
        id: axis.id,
        name: axis[language].name,
        genres: axis[language].genres,
        description: axis[language].short,
        score: Math.round(Number(axis.score || 0))
      }));
      const badges = [
        focusCopy.label,
        ratingCopy.label
      ].filter(Boolean);

      return { title, summary, discovery, style, badges, axisDetails };
    };

    // 시트 헤더에 공백, 줄바꿈, 대소문자 차이가 있어도 값을 찾습니다.
    const getNormalizedField = (item, ...candidateKeys) => {
      if (!item) return undefined;

      for (const key of candidateKeys) {
        if (Object.prototype.hasOwnProperty.call(item, key)) return item[key];
      }

      const normalizedCandidates = candidateKeys.map(key =>
        String(key).replace(/[\s_-]+/g, '').toLowerCase()
      );

      const matchedKey = Object.keys(item).find(key =>
        normalizedCandidates.includes(String(key).replace(/[\s_-]+/g, '').toLowerCase())
      );

      return matchedKey ? item[matchedKey] : undefined;
    };


    // --- 스포일러 텍스트 처리 ---
    const SpoilerText = ({ text = '', className = '' }) => {
      const [revealed, setRevealed] = useState({});
      const parts = [];
      const regex = /\[([^\[\]]+)\]/g;
      let lastIndex = 0;
      let match;
      let spoilerIndex = 0;

      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push(text.slice(lastIndex, match.index));
        }

        const key = spoilerIndex++;
        const isOpen = !!revealed[key];
        const spoilerText = match[1];

        parts.push(
          <span
            key={`spoiler-${key}`}
            role="button"
            tabIndex="0"
            onClick={(e) => {
              e.stopPropagation();
              setRevealed(prev => ({ ...prev, [key]: true }));
            }}
            onKeyDown={(e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                e.stopPropagation();
                setRevealed(prev => ({ ...prev, [key]: true }));
              }
            }}
            style={{
              display: 'inline-block',
              maxWidth: '100%',
              textAlign: 'left',
              whiteSpace: 'pre-wrap',
              overflowWrap: 'break-word',
              wordBreak: 'break-word',
              verticalAlign: 'baseline'
            }}
            className={`align-baseline mx-0.5 px-1.5 py-0.5 rounded-md border transition-colors cursor-pointer select-none ${
              isOpen
                ? 'bg-slate-800/80 border-teal-400/40 text-slate-100'
                : 'bg-slate-700 border-slate-600 text-transparent hover:bg-slate-600'
            }`}
            aria-label={isOpen ? '스포일러 내용' : '스포일러 보기'}
            title={isOpen ? '' : '클릭해서 스포일러 보기'}
          >
            {spoilerText}
          </span>
        );

        lastIndex = regex.lastIndex;
      }

      if (lastIndex < text.length) {
        parts.push(text.slice(lastIndex));
      }

      return <span className={className} style={{ display: 'block', width: '100%', textAlign: 'left' }}>{parts}</span>;
    };

      const loadGenreStats = async (nickname) => {

      // 리뷰 제목이 "한국어 제목 | 원제" 또는 "한국어 제목 ｜ 원제" 형식이면
      // TMDB 검색창에는 첫 번째 제목만 자동 입력합니다.
      const getTmdbInitialQuery = (movieTitle) => {
        const originalTitle = String(movieTitle || '').trim();
        if (!originalTitle) return '';

        const [firstTitle] = originalTitle.split(
          /\s*(?:\||｜)\s*/
        );

        return String(firstTitle || '').trim() || originalTitle;
      };

      // 영화 정보 모달에서는 구분자 앞·뒤 제목을 함께 검색해 정확도를 높입니다.
      // 예: "짝사랑 세계 | 片思い世界" → "짝사랑 세계 片思い世界"
      const getMovieInfoInitialQuery = (movieTitle) => {
        const originalTitle = String(movieTitle || '').trim();
        if (!originalTitle) return '';

        return originalTitle
          .replace(/\s*(?:\||｜)\s*/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      };

      const normalizeMovieTitleToken = (value) => {
        const normalized = String(value || '').normalize('NFKC').toLocaleLowerCase();
        return normalized
          .replace(/\(\s*(?:19|20)\d{2}\s*\)$/, '')
          .replace(/[^\p{L}\p{N}]+/gu, '');
      };

      const getMovieTitleAliases = (movieTitle) => {
        const rawTitle = String(movieTitle || '').trim();
        if (!rawTitle) return [];

        return Array.from(new Set(
          rawTitle
            .split(/\s*(?:\||｜)\s*/)
            .map(normalizeMovieTitleToken)
            .filter(Boolean)
        ));
      };

      const formatTmdbReviewTitle = (movie) => {
        const localizedTitle = String(movie?.title || movie?.original_title || '').trim();
        const originalTitle = String(movie?.original_title || '').trim();

        if (!localizedTitle) return '';
        if (originalTitle && normalizeMovieTitleToken(localizedTitle) !== normalizeMovieTitleToken(originalTitle)) {
          return `${localizedTitle} | ${originalTitle}`;
        }
        return localizedTitle;
      };

      const openPosterEditor = (review) => {

        setPosterTarget(review);
        setPosterDraft(getPosterUrl(review));
        setTmdbQuery(getTmdbInitialQuery(review.movieTitle));

        setTmdbError('');

      const buildTmdbPosterUrl = (posterPath) =>
        posterPath ? `${TMDB_IMAGE_BASE_URL}${posterPath}` : '';

      const wait = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));

      // 기존 Apps Script의 tmdbSearch만 사용해 첫 번째 포스터 검색 결과를 가져옵니다.
      // 검색 실패 시 리뷰 등록 자체에는 영향을 주지 않고 빈 포스터 상태로 남깁니다.
      const fetchFirstTmdbPosterUrl = async (movieTitle) => {
        const query = getTmdbInitialQuery(movieTitle);
        if (!query) return '';

        const language = appLang === 'ko' ? 'ko-KR' : 'ja-JP';
        const requestUrl =
          SCRIPT_URL +
          '?action=tmdbSearch' +
          '&query=' + encodeURIComponent(query) +
          '&language=' + encodeURIComponent(language) +
          '&t=' + Date.now();

        const response = await fetch(requestUrl, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`TMDB_PROXY_HTTP_${response.status}`);
        }

        const data = await response.json();
        if (data.success === false) {
          const error = new Error(data.message || t.tmdbSearchError);
          error.code = data.code || '';
          throw error;
        }

        const firstMovieWithPoster = (data.results || []).find(movie => movie.poster_path);
        return firstMovieWithPoster ? buildTmdbPosterUrl(firstMovieWithPoster.poster_path) : '';
      };

      const closeMovieInfo = () => {
        setMovieInfoTarget(null);

      const toggleMovieReviewDetail = (reviewId) => {
        setExpandedMovieReviewIds(prev => ({

      };

      const searchMovieInfo = async (queryOverride, targetOverride = movieInfoTarget) => {
        const query = String(queryOverride ?? movieInfoQuery).trim();
        if (!query) return;

        setMovieInfoQuery(query);
        setIsMovieInfoSearching(true);
        setMovieInfoError('');
        setMovieInfoResults([]);
        setSelectedMovieInfo(null);
        setExpandedMovieReviewIds({});

        try {
          const language = appLang === 'ko' ? 'ko-KR' : 'ja-JP';
          const requestUrl =
            SCRIPT_URL +
            '?action=tmdbSearch' +
            '&query=' + encodeURIComponent(query) +
            '&language=' + encodeURIComponent(language) +
            '&t=' + Date.now();

          const response = await fetch(requestUrl, {
            method: 'GET',
            cache: 'no-store'
          });

          if (!response.ok) {
            throw new Error(`TMDB_PROXY_HTTP_${response.status}`);
          }

          const data = await response.json();

          if (data.success === false) {
            const error = new Error(data.message || t.movieInfoSearchError);
            error.code = data.code || '';
            throw error;
          }

          // TMDB ID가 없는 과거 기록이나 모달 안의 수동 재검색에만 제목 검색을 사용합니다.
          const results = (data.results || []).slice(0, 10);
          const targetReview = targetOverride || movieInfoTarget;
          const savedPosterUrl = getPosterUrl(targetReview);
          const posterMatchedMovie = savedPosterUrl
            ? results.find(movie => movie.poster_path && buildTmdbPosterUrl(movie.poster_path) === savedPosterUrl)
            : null;

          setMovieInfoResults(results);
          setSelectedMovieInfo(posterMatchedMovie || results[0] || null);

          setIsMovieInfoSearching(false);

      // 리뷰에 저장된 TMDB 고유 ID로 영화 한 편을 직접 조회합니다.
      // ID 조회에 실패한 경우에만 기존 제목 검색을 예비 방식으로 사용합니다.
      const loadMovieInfoByTmdbId = async (tmdbId, targetReview, fallbackQuery) => {
        const normalizedTmdbId = String(tmdbId || '').trim();
        if (!normalizedTmdbId) {
          searchMovieInfo(fallbackQuery, targetReview);
          return;
        }

        setIsMovieInfoSearching(true);
        setMovieInfoError('');
        setMovieInfoResults([]);
        setSelectedMovieInfo(null);
        setExpandedMovieReviewIds({});

        try {
          const language = appLang === 'ko' ? 'ko-KR' : 'ja-JP';
          const requestUrl =
            SCRIPT_URL +
            '?action=tmdbMovieDetails' +
            '&id=' + encodeURIComponent(normalizedTmdbId) +
            '&language=' + encodeURIComponent(language) +
            '&t=' + Date.now();

          const response = await fetch(requestUrl, {
            method: 'GET',
            cache: 'no-store'
          });

          if (!response.ok) {
            throw new Error(`TMDB_PROXY_HTTP_${response.status}`);
          }

          const data = await response.json();
          if (data.success === false || !data.movie) {
            const error = new Error(data.message || t.movieInfoSearchError);
            error.code = data.code || '';
            throw error;
          }

          setSelectedMovieInfo(data.movie);
          setMovieInfoResults([data.movie]);
        } catch (error) {
          console.warn('TMDB movie detail by ID failed. Falling back to title search:', error);
          await searchMovieInfo(fallbackQuery, targetReview);
        } finally {
          setIsMovieInfoSearching(false);
        }
      };

      const openMovieInfo = (review) => {
        const initialQuery = getMovieInfoInitialQuery(review?.movieTitle);
        const savedTmdbId = String(review?.tmdbId || '').trim();

        setMovieInfoTarget(review);
        setMovieInfoQuery(initialQuery);
        setMovieInfoResults([]);
        setSelectedMovieInfo(null);
        setMovieInfoError('');
        setExpandedMovieReviewIds({});

        if (savedTmdbId) {
          loadMovieInfoByTmdbId(savedTmdbId, review, initialQuery);
        } else {
          searchMovieInfo(initialQuery, review);
        }
      };

      const getMatchingMovieReviews = (movie) => {
        if (!movie) return [];

        const selectedTmdbId = String(movie.id || '').trim();
        const selectedAliases = new Set([
          ...getMovieTitleAliases(movie.title),
          ...getMovieTitleAliases(movie.original_title)
        ]);
        const selectedPosterUrl = movie.poster_path ? buildTmdbPosterUrl(movie.poster_path) : '';

        return appData.reviews
          .filter(review => {
            const reviewTmdbId = String(review.tmdbId || '').trim();

            // 양쪽 모두 TMDB ID가 있으면 제목이나 포스터보다 ID 일치를 우선합니다.
            if (selectedTmdbId && reviewTmdbId) {
              return selectedTmdbId === reviewTmdbId;
            }

            const reviewPosterUrl = getPosterUrl(review);
            if (selectedPosterUrl && reviewPosterUrl && selectedPosterUrl === reviewPosterUrl) return true;

            const reviewAliases = getMovieTitleAliases(review.movieTitle);
            return reviewAliases.some(alias => selectedAliases.has(alias));
          })
          .sort((a, b) => {
            const dateA = formatDateOnly(a.date) || '';
            const dateB = formatDateOnly(b.date) || '';
            return dateB.localeCompare(dateA);
          });
      };

      const getAlbumMovieGroups = () => {
        const groups = [];
        const isAlbumRepresentativeCandidate = (review) => review?.nickname !== 'Kani';

        const sortedReviews = [...appData.reviews].sort((a, b) => {
          const dateA = formatDateOnly(a.date) || '9999-12-31';
          const dateB = formatDateOnly(b.date) || '9999-12-31';
          const dateCompare = dateA.localeCompare(dateB);
          if (dateCompare !== 0) return dateCompare;

          const createdAtA = new Date(a.createdAt || 0).getTime() || 0;
          const createdAtB = new Date(b.createdAt || 0).getTime() || 0;
          return createdAtA - createdAtB;
        });

        sortedReviews.forEach(review => {
          const aliases = getMovieTitleAliases(review.movieTitle);
          const posterUrl = getPosterUrl(review);
          const reviewDate = formatDateOnly(review.date) || '';
          const matchedGroup = groups.find(group => {
            if (posterUrl && group.posterUrls.has(posterUrl)) return true;
            return aliases.some(alias => group.aliases.has(alias));
          });

          if (matchedGroup) {
            matchedGroup.reviews.push(review);
            aliases.forEach(alias => matchedGroup.aliases.add(alias));
            if (posterUrl) matchedGroup.posterUrls.add(posterUrl);

            if (!matchedGroup.hasEligibleRepresentative && isAlbumRepresentativeCandidate(review)) {
              matchedGroup.id = review.id;
              matchedGroup.representative = review;
              matchedGroup.posterUrl = posterUrl;
              matchedGroup.hasEligibleRepresentative = true;
            }

            // Album 전체 정렬에 쓰는 최근 관람일만 별도로 갱신합니다.
            if (reviewDate && reviewDate > matchedGroup.latestDate) {
              matchedGroup.latestDate = reviewDate;
            }
            return;
          }

          groups.push({
            id: review.id,
            representative: review,
            reviews: [review],
            aliases: new Set(aliases),
            posterUrls: new Set(posterUrl ? [posterUrl] : []),
            posterUrl,
            hasEligibleRepresentative: isAlbumRepresentativeCandidate(review),
            latestDate: reviewDate
          });
        });

        return groups.map(group => {
          const ratings = group.reviews
            .map(review => Number(review.rating))
            .filter(rating => Number.isFinite(rating));
          const average = ratings.length
            ? ratings.reduce((sum, rating) => sum + rating, 0) / ratings.length
            : 0;
          const memberCount = new Set(group.reviews.map(review => review.nickname)).size;

          return {
            ...group,
            average,
            memberCount,
            reviewCount: group.reviews.length
          };
        }).sort((a, b) => {
          // 가장 많은 멤버가 본 영화를 우선 표시합니다.
          const memberCompare = b.memberCount - a.memberCount;
          if (memberCompare !== 0) return memberCompare;

          // 감상 인원이 같으면 리뷰 수, 평균 별점, 최근 관람일 순으로 정렬합니다.
          const reviewCompare = b.reviewCount - a.reviewCount;
          if (reviewCompare !== 0) return reviewCompare;

          const averageCompare = b.average - a.average;
          if (averageCompare !== 0) return averageCompare;

          const dateCompare = String(b.latestDate || '').localeCompare(String(a.latestDate || ''));
          if (dateCompare !== 0) return dateCompare;

          return String(a.representative?.movieTitle || '').localeCompare(
            String(b.representative?.movieTitle || ''),
            appLang === 'ko' ? 'ko' : 'ja'
          );
        });
      };

      const closeRandomMoviePicker = () => {
        randomDrawTokenRef.current += 1;
        setRandomPickerOpen(false);
        setIsRandomPicking(false);
        setRandomPreviewMovie(null);
        setRandomPickedMovie(null);
        setRandomDrawStep(0);
      };

      const drawRandomMovie = async () => {
        const moviePool = getAlbumMovieGroups().filter(group => group?.representative);
        if (moviePool.length === 0 || isRandomPicking) return;

        const previousPickedId = randomPickedMovie?.id;
        const finalPool = moviePool.length > 1 && previousPickedId
          ? moviePool.filter(group => group.id !== previousPickedId)
          : moviePool;

        const drawToken = randomDrawTokenRef.current + 1;
        randomDrawTokenRef.current = drawToken;
        setRandomPickerOpen(true);
        setIsRandomPicking(true);
        setRandomPickedMovie(null);
        setRandomDrawStep(0);

        const totalSteps = Math.max(16, Math.min(26, finalPool.length * 3));
        let currentMovie = finalPool[0];
        let previousIndex = -1;

        for (let step = 0; step < totalSteps; step++) {
          if (randomDrawTokenRef.current !== drawToken) return;

          let nextIndex = Math.floor(Math.random() * finalPool.length);
          if (finalPool.length > 1 && nextIndex === previousIndex) {
            nextIndex = (nextIndex + 1 + Math.floor(Math.random() * (finalPool.length - 1))) % finalPool.length;
          }

          previousIndex = nextIndex;
          currentMovie = finalPool[nextIndex];
          setRandomPreviewMovie(currentMovie);
          setRandomDrawStep(step + 1);

          const progress = step / Math.max(1, totalSteps - 1);
          const delay = 55 + Math.round(progress * progress * 145);
          await wait(delay);
        }

        if (randomDrawTokenRef.current !== drawToken) return;
        setRandomPreviewMovie(currentMovie);
        setRandomPickedMovie(currentMovie);
        setIsRandomPicking(false);
      };

      const openPickedMovieInfo = () => {
        const pickedMovie = randomPickedMovie;
        if (!pickedMovie?.representative) return;

        randomDrawTokenRef.current += 1;
        setRandomPickerOpen(false);
        setIsRandomPicking(false);
        setRandomPreviewMovie(null);
        setRandomPickedMovie(null);
        setRandomDrawStep(0);
        openMovieInfo(pickedMovie.representative);
      };

      useEffect(() => {
        if (!randomPickerOpen) return;

        const handleRandomPickerKeyDown = event => {
          if (event.key === 'Escape') closeRandomMoviePicker();
        };

        window.addEventListener('keydown', handleRandomPickerKeyDown);
        return () => window.removeEventListener('keydown', handleRandomPickerKeyDown);
      }, [randomPickerOpen]);


      // Album 검색창도 TMDB 후보를 사용합니다. 후보를 선택하면
      // 선택한 영화의 현지 제목, 원제, 포스터를 기존 Album 기록과 비교합니다.
      useEffect(() => {
        const query = String(albumSearch || '').trim();
        const selectedTitle = selectedAlbumMovie ? formatTmdbReviewTitle(selectedAlbumMovie) : '';

        if (selectedAlbumMovie && query === selectedTitle) {
          setAlbumTmdbResults([]);
          setAlbumTmdbError('');
          setHasAlbumTmdbSearched(false);
          setIsAlbumTmdbSearching(false);
          return;
        }

        if (query.length < 2) {
          setAlbumTmdbResults([]);
          setAlbumTmdbError('');
          setHasAlbumTmdbSearched(false);
          setIsAlbumTmdbSearching(false);
          return;
        }

        let isCancelled = false;
        const timer = setTimeout(async () => {
          setIsAlbumTmdbSearching(true);
          setAlbumTmdbError('');

          try {
            const language = appLang === 'ko' ? 'ko-KR' : 'ja-JP';
            const requestUrl =
              SCRIPT_URL +
              '?action=tmdbSearch' +
              '&query=' + encodeURIComponent(query) +
              '&language=' + encodeURIComponent(language) +
              '&t=' + Date.now();

            const response = await fetch(requestUrl, { method: 'GET', cache: 'no-store' });
            if (!response.ok) throw new Error(`TMDB_PROXY_HTTP_${response.status}`);

            const data = await response.json();
            if (data.success === false) throw new Error(data.message || t.albumTmdbSearchError);
            if (isCancelled) return;

            setAlbumTmdbResults((data.results || []).slice(0, 8));
            setHasAlbumTmdbSearched(true);
          } catch (error) {
            if (isCancelled) return;
            console.error('Album TMDB search error:', error);
            setAlbumTmdbResults([]);
            setHasAlbumTmdbSearched(true);
            setAlbumTmdbError(t.albumTmdbSearchError);
          } finally {
            if (!isCancelled) setIsAlbumTmdbSearching(false);
          }
        }, 500);

        return () => {
          isCancelled = true;
          clearTimeout(timer);
        };
      }, [albumSearch, selectedAlbumMovie, appLang]);

      const selectAlbumMovie = (movie) => {
        setSelectedAlbumMovie(movie);
        setAlbumSearch(formatTmdbReviewTitle(movie));

        setAlbumTmdbError('');

      const albumGroupMatchesTmdbMovie = (movieGroup, movie) => {

      const MovieTitleButton = ({ review, className = '', truncate = false }) => (

      const searchTmdbPosters = async (queryOverride) => {

          const data = await response.json();

          if (data.success === false) {

          const results = (data.results || [])

          console.error('TMDB proxy search error:', error);
          const isAuthError = error.code === 'TMDB_AUTH_ERROR';
          setTmdbError(isAuthError ? t.tmdbAuthError : (error.message || t.tmdbSearchError));
        } finally {
          setIsTmdbSearching(false);
        }

      const removePosterUrl = async () => {

          await postDataToSheet('editItem', {
            sheetName: 'Reviews',
            id: posterTarget.id,

          updateDataAndCache(prev => ({
            ...prev,
            reviews: prev.reviews.map(review =>

            )
          }));

          const nextMap = { ...posterMap };
          delete nextMap[posterTarget.id];
          setPosterMap(nextMap);
          localStorage.setItem('movieLogPosterMap', JSON.stringify(nextMap));
          closePosterEditor();
        } catch (error) {

          alert(appLang === 'ko' ? '포스터 삭제 중 오류가 발생했습니다.' : 'ポスターの削除中にエラーが発生しました。');
        } finally {
          setIsSubmitting(false);
        }
      };

      const openGoogleImageSearch = (movieTitle) => {
        const query = encodeURIComponent(`${movieTitle} 영화 포스터`);
        window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank', 'noopener,noreferrer');
      };

      const fetchData = async () => {
        const cachedData = localStorage.getItem('movieLogData_hideFix_v1');
        if (cachedData) {
          try {
            setAppData(JSON.parse(cachedData));
            setIsLoading(false);
          } catch (e) {
            console.error("Cache parsing error", e);
          }
        } else {
          setIsLoading(true);
        }

        try {
          const fetchUrl = SCRIPT_URL + "?t=" + new Date().getTime();
          const response = await fetch(fetchUrl, { cache: 'no-store' });
          const data = await response.json();
          
          const normalize = (arr = []) => arr.map(item => ({
            id: item.ID || item.id,
            type: item.Type || item.type,
            parentId: item.ParentID || item.parentId,
            parentType: item.ParentType || item.parentType,
            nickname: item.Nickname || item.nickname,
            date: item.Date || item.date,
            week: item.Week || item.week,
            movieTitle: item.MovieTitle || item.movieTitle,
            rating: item.Rating || item.rating,
            posterUrl: item.PosterUrl || item.posterUrl || '',
            tmdbId: String(getNormalizedField(item, 'TmdbId', 'TMDBID', 'tmdbId') || ''),
            genreIds: parseGenreIds(getNormalizedField(item, 'GenreIds', 'genreIds')),
            runtime: Number(getNormalizedField(item, 'Runtime', 'runtime') || 0),
            keywordIds: parseNumericIds(getNormalizedField(item, 'KeywordIds', 'keywordIds')),
            hideFromSummary: parseBoolean(getNormalizedField(item, 'HideFromSummary', 'hideFromSummary')),
            titleKo: item.TitleKo || item.titleKo,
            titleJp: item.TitleJp || item.titleJp,
            contentKo: item.ContentKo || item.contentKo,
            contentJp: item.ContentJp || item.contentJp,
            commentKo: item.CommentKo || item.commentKo,
            commentJp: item.CommentJp || item.commentJp,
            createdAt: item.CreatedAt || item.createdAt
          }));

          const freshData = {
            reviews: normalize(data.reviews),
            posts: normalize(data.posts),
            comments: normalize(data.comments)
          };

          setAppData(freshData);
          localStorage.setItem('movieLogData_hideFix_v1', JSON.stringify(freshData));
          
        } catch (error) {
          console.error("Error fetching data:", error);
        } finally {
          setIsLoading(false);
        }
      };

      const updateDataAndCache = (updater) => {
        setAppData((prev) => {
          const newData = updater(prev);
          localStorage.setItem('movieLogData_hideFix_v1', JSON.stringify(newData));
          return newData;
        });
      };

      useEffect(() => {

        } else {

      const postDataToSheet = async (action, payload) => {

          headers: { 'Content-Type': 'text/plain;charset=utf-8' },

        });

      const persistPosterForReview = async (reviewId, posterUrl) => {
        if (!reviewId || !posterUrl) return;

        await postDataToSheet('editItem', {
          sheetName: 'Reviews',
          id: reviewId,
          payload: { PosterUrl: posterUrl }
        });

        updateDataAndCache(prev => ({
          ...prev,
          reviews: prev.reviews.map(review =>
            review.id === reviewId ? { ...review, posterUrl } : review
          )
        }));

        // 과거 버전에서 브라우저에만 저장된 포스터가 있다면 시트 값을 우선하도록 정리합니다.
        setPosterMap(prev => {
          if (!Object.prototype.hasOwnProperty.call(prev, reviewId)) return prev;
          const next = { ...prev };
          delete next[reviewId];
          localStorage.setItem('movieLogPosterMap', JSON.stringify(next));
          return next;
        });
      };

      const autoFillMissingPosters = async (reviews) => {
        if (posterBackfill.isRunning) return;

        const targets = (reviews || []).filter(review =>
          isOwner(review) && !getPosterUrl(review)
        );

        if (targets.length === 0) {
          setPosterBackfill({
            isRunning: false,
            total: 0,
            processed: 0,
            saved: 0,
            notFound: 0,
            failed: 0,
            finished: true
          });
          return;
        }

        setPosterBackfill({
          isRunning: true,
          total: targets.length,
          processed: 0,
          saved: 0,
          notFound: 0,
          failed: 0,
          finished: false
        });

        let saved = 0;
        let notFound = 0;
        let failed = 0;
        const searchCache = new Map();

        for (let index = 0; index < targets.length; index++) {
          const review = targets[index];
          const queryKey = getTmdbInitialQuery(review.movieTitle).toLocaleLowerCase();

          try {
            let posterUrl = searchCache.get(queryKey);

            if (posterUrl === undefined) {
              posterUrl = await fetchFirstTmdbPosterUrl(review.movieTitle);
              searchCache.set(queryKey, posterUrl || '');
            }

            if (posterUrl) {
              await persistPosterForReview(review.id, posterUrl);
              saved += 1;
            } else {
              notFound += 1;
            }
          } catch (error) {
            console.warn('Automatic poster backfill failed:', review.movieTitle, error);
            failed += 1;
          }

          const processed = index + 1;
          setPosterBackfill({
            isRunning: processed < targets.length,
            total: targets.length,
            processed,
            saved,
            notFound,
            failed,
            finished: processed === targets.length
          });

          // Apps Script와 TMDB에 요청이 한꺼번에 몰리지 않도록 순차 처리합니다.
          if (processed < targets.length) await wait(350);
        }
      };

      const submitReview = async (e, formData) => {

          await postDataToSheet('addComment', newComment);

      const submitFeedback = async (formData) => {
        setIsSubmitting(true);
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'sendFeedback',
              payload: {
                type: formData.type,
                nickname: formData.nickname,
                content: formData.content.trim(),
                language: appLang,
                pageUrl: window.location.href,
                userAgent: navigator.userAgent,
                createdAt: new Date().toISOString()
              }
            })
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const responseText = await response.text();
          if (responseText) {
            try {
              const result = JSON.parse(responseText);
              if (result.success === false) throw new Error(result.message || 'Feedback send failed');
            } catch (parseError) {
              if (parseError instanceof SyntaxError) {
                // 기존 Apps Script가 JSON이 아닌 빈 문자열/텍스트를 반환해도 HTTP가 성공하면 전송 완료로 처리합니다.
              } else {
                throw parseError;
              }
            }
          }
          return true;
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleEditSave = async (e) => {
        e.preventDefault();
        if (!editingItem || !currentUser) return;

        const { id, type, form } = editingItem;
        const targetItem = findItemByType(id, type);

        if (!isOwner(targetItem)) {
          alert(t.ownerOnly);
          setEditingItem(null);
          return;
        }

        setIsSubmitting(true);
        try {
          if (type === 'review') {
            const week = calculateWeek(form.date);
            const titleChanged = String(form.movieTitle || '').trim() !== String(targetItem.movieTitle || '').trim();
            const nextPosterUrl = form.selectedTmdbMovie
              ? buildTmdbPosterUrl(form.selectedTmdbMovie.poster_path)
              : getPosterUrl(targetItem);
            const nextTmdbId = form.selectedTmdbMovie?.id
              ? String(form.selectedTmdbMovie.id)
              : (titleChanged ? '' : String(targetItem.tmdbId || ''));
            const nextGenreIds = form.selectedTmdbMovie
              ? parseGenreIds(form.selectedTmdbMovie.genre_ids)
              : (titleChanged ? [] : parseGenreIds(targetItem.genreIds));
            const metadataNeedsRefresh = !!form.selectedTmdbMovie || titleChanged;
            const nextRuntime = metadataNeedsRefresh ? 0 : Number(targetItem.runtime || 0);
            const nextKeywordIds = metadataNeedsRefresh ? [] : parseNumericIds(targetItem.keywordIds);
            const payload = {
              Nickname: currentUser,
              Date: form.date,
              Week: week,
              MovieTitle: form.movieTitle,
              Rating: parseFloat(form.rating),
              Comment: form.comment,
              PosterUrl: nextPosterUrl,
              TmdbId: nextTmdbId,
              GenreIds: serializeGenreIds(nextGenreIds),
              Runtime: nextRuntime || '',
              KeywordIds: serializeNumericIds(nextKeywordIds),
              HideFromSummary: form.hideFromSummary ? 'TRUE' : 'FALSE'
            };

            await postDataToSheet('editItem', { sheetName: 'Reviews', id, payload });
            updateDataAndCache(prev => ({
              ...prev,
              reviews: prev.reviews.map(r => r.id === id ? {
                ...r,
                nickname: currentUser,
                date: form.date,
                week,
                movieTitle: form.movieTitle,
                rating: payload.Rating,
                posterUrl: nextPosterUrl,
                tmdbId: nextTmdbId,
                genreIds: nextGenreIds,
                runtime: nextRuntime,
                keywordIds: nextKeywordIds,
                commentKo: form.comment,
                commentJp: form.comment,
                hideFromSummary: !!form.hideFromSummary
              } : r)
            }));

            if (form.selectedTmdbMovie) {
              const nextMap = { ...posterMap };
              delete nextMap[id];
              setPosterMap(nextMap);
              localStorage.setItem('movieLogPosterMap', JSON.stringify(nextMap));
            }
          } else if (type === 'post') {
            const payload = {
              Nickname: currentUser,
              Title: form.title,
              Content: form.content
            };

            await postDataToSheet('editItem', { sheetName: 'Posts', id, payload });
            updateDataAndCache(prev => ({
              ...prev,
              posts: prev.posts.map(p => p.id === id ? {
                ...p,
                nickname: currentUser,
                titleKo: form.title,
                titleJp: form.title,
                contentKo: form.content,
                contentJp: form.content
              } : p)
            }));

            if (selectedPost && selectedPost.id === id) {
              setSelectedPost(prev => ({
                ...prev,
                nickname: currentUser,
                titleKo: form.title,
                titleJp: form.title,
                contentKo: form.content,
                contentJp: form.content
              }));
            }
          } else if (type === 'comment') {
            const payload = {
              Nickname: currentUser,
              Comment: form.comment
            };

            await postDataToSheet('editItem', { sheetName: 'Comments', id, payload });
            updateDataAndCache(prev => ({
              ...prev,
              comments: prev.comments.map(c => c.id === id ? {
                ...c,
                nickname: currentUser,
                commentKo: form.comment,
                commentJp: form.comment
              } : c)
            }));
          }

          setEditingItem(null);
        } finally {
          setIsSubmitting(false);
        }
      };

      const requestDelete = (id, type) => {
        const targetItem = findItemByType(id, type);

        if (!isOwner(targetItem)) {
          alert(t.ownerOnly);
          return;
        }

        setItemToDelete({ id, type });
      };

      const executeDelete = async () => {
        if (!itemToDelete) return;

        const { id, type } = itemToDelete;
        const targetItem = findItemByType(id, type);

        if (!isOwner(targetItem)) {
          alert(t.ownerOnly);
          setItemToDelete(null);
          return;
        }

        setIsSubmitting(true);
        try {
          let sheetName = '';
          if (type === 'review') sheetName = 'Reviews';
          else if (type === 'post') sheetName = 'Posts';
          else if (type === 'comment') sheetName = 'Comments';

          await postDataToSheet('deleteItem', { sheetName, id });

          if (type === 'review') {
            updateDataAndCache(prev => ({ ...prev, reviews: prev.reviews.filter(r => r.id !== id) }));
          } else if (type === 'post') {
            updateDataAndCache(prev => ({ ...prev, posts: prev.posts.filter(p => p.id !== id) }));
            if (selectedPost && selectedPost.id === id) setSelectedPost(null);
          } else if (type === 'comment') {
            updateDataAndCache(prev => ({ ...prev, comments: prev.comments.filter(c => c.id !== id) }));
          }

          setItemToDelete(null);
        } catch (error) {
          console.error("Error deleting item:", error);
          alert(appLang === 'ko' ? '삭제 중 오류가 발생했습니다.' : '削除中にエラーが発生しました。');
        } finally {
          setIsSubmitting(false);
        }
      };

      // ✨ 모바일 최적화: 별 크기를 스마트폰에서 약간 작게 표시 ✨
      const renderStars = (rating) => {
        const stars = [];
        for (let i = 1; i <= 5; i++) {
          if (rating >= i) stars.push(<Star key={i} className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-yellow-400 fill-yellow-400" />);
          else if (rating >= i - 0.5) stars.push(
            <div key={i} className="relative w-3 h-3 sm:w-3.5 sm:h-3.5"><Star className="absolute w-3 h-3 sm:w-3.5 sm:h-3.5 text-gray-600" /><div className="absolute overflow-hidden w-1/2"><Star className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-yellow-400 fill-yellow-400" /></div></div>
          );
          else stars.push(<Star key={i} className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-gray-600" />);
        }
        return <div className="flex space-x-0.5">{stars}</div>;
      };

      const toggleReviewExpand = (id) => {
        setExpandedReviews(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const CommentSection = ({ parentId, parentType }) => {
      const [commentForm, setCommentForm] = useState({ comment: '' });
      
      const targetComments = appData.comments
        .filter(c => c.parentId === parentId)
        .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

      return (
        <div className="mt-4 pt-4 border-t border-slate-700/50">
            <h4 className="text-sm font-semibold flex items-center gap-1.5 text-teal-400 mb-3">
              <MessageSquare className="w-4 h-4" /> {t.comments} ({targetComments.length})
            </h4>
            
            {targetComments.length > 0 && (
              <div className="space-y-3 mb-4">
                {targetComments.map(c => (
                  <div key={c.id} className="bg-slate-800/40 rounded-lg p-3 text-sm group">
                    {editingItem?.id === c.id ? (
                      <form onSubmit={handleEditSave} className="flex flex-col sm:flex-row gap-2">
                        <CurrentUserBadge className="bg-slate-900 sm:w-auto" />
                        <textarea required value={editingItem.form.comment} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, comment: e.target.value } })} className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-teal-400 min-h-[60px] resize-y" rows="2" />
                        <div className="flex justify-end gap-1">
                          <button type="submit" disabled={isSubmitting} className="text-teal-400 bg-slate-800 p-2 sm:p-1 hover:bg-slate-700 rounded"><Send className="w-4 h-4" /></button>
                          <button type="button" onClick={() => setEditingItem(null)} className="text-slate-400 bg-slate-800 p-2 sm:p-1 hover:bg-slate-700 rounded"><X className="w-4 h-4" /></button>
                        </div>
                      </form>
                    ) : (
                      <>
                        <div className="flex justify-between items-start mb-1">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="font-medium text-slate-300 flex items-center gap-1">{USER_EMOJIS[c.nickname]} {c.nickname}</span>
                            <span className="text-[10px] sm:text-xs text-slate-500">{formatKSTDate(c.createdAt)}</span>
                          </div>
                          {/* 로그인한 작성자에게만 수정/삭제 버튼을 표시합니다. */}
                          {isOwner(c) && (
                            <div className="flex gap-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity shrink-0">
                              <button onClick={() => setEditingItem({ id: c.id, type: 'comment', form: { comment: appLang === 'ko' ? c.commentKo : c.commentJp } })} className="text-slate-400 hover:text-teal-400 transition-colors p-1"><Edit2 className="w-3.5 h-3.5" /></button>
                              <button onClick={() => requestDelete(c.id, 'comment')} className="text-slate-400 hover:text-red-400 transition-colors p-1"><Trash2 className="w-3.5 h-3.5" /></button>
                            </div>
                          )}
                        </div>
                        <SpoilerText text={appLang === 'ko' ? c.commentKo : c.commentJp} className="block text-left text-slate-200 break-words whitespace-pre-wrap mt-1" />
                      </>
                    )}
                  </div>
                ))}
              </div>
            )}

            <form onSubmit={(e) => {
              submitComment(e, commentForm, parentId, parentType).then(() => setCommentForm({...commentForm, comment: ''}));
            }} className="flex flex-col sm:flex-row gap-2">
              <CurrentUserBadge className="w-full sm:w-auto" />
              <textarea 
                required placeholder={t.writeComment}
                value={commentForm.comment}
                onChange={e => setCommentForm({...commentForm, comment: e.target.value})}
                className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500 resize-y min-h-[44px]"
                rows="2"
              />
              <button type="submit" disabled={isSubmitting} className="bg-slate-700 hover:bg-teal-500 hover:text-white px-3 py-2 rounded-lg transition-colors flex justify-center items-center w-full sm:w-auto">
                {isSubmitting ? <Loader2 className="w-4 h-4 animate-spin" /> : <Send className="w-4 h-4" />}
              </button>
            </form>
          </div>
        );
      };


      // 리뷰 수정 시에도 신규 작성과 동일하게 TMDB 후보를 선택할 수 있습니다.
      const ReviewMovieEditField = () => {
        const [movieCandidates, setMovieCandidates] = useState([]);
        const [isCandidateSearching, setIsCandidateSearching] = useState(false);
        const [candidateError, setCandidateError] = useState('');
        const [hasSearchedCandidates, setHasSearchedCandidates] = useState(false);

        const selectedTmdbMovie = editingItem?.type === 'review'
          ? (editingItem.form.selectedTmdbMovie || null)
          : null;
        const movieTitle = editingItem?.type === 'review'
          ? String(editingItem.form.movieTitle || '')
          : '';

        useEffect(() => {
          if (!editingItem || editingItem.type !== 'review') return;

          const query = movieTitle.trim();
          const selectedTitle = selectedTmdbMovie ? formatTmdbReviewTitle(selectedTmdbMovie) : '';

          if (selectedTmdbMovie && query === selectedTitle) {
            setMovieCandidates([]);
            setCandidateError('');
            setHasSearchedCandidates(false);
            setIsCandidateSearching(false);
            return;
          }

          if (query.length < 2) {
            setMovieCandidates([]);
            setCandidateError('');
            setHasSearchedCandidates(false);
            setIsCandidateSearching(false);
            return;
          }

          let isCancelled = false;
          const timer = setTimeout(async () => {
            setIsCandidateSearching(true);
            setCandidateError('');

            try {
              const language = appLang === 'ko' ? 'ko-KR' : 'ja-JP';
              const requestUrl =
                SCRIPT_URL +
                '?action=tmdbSearch' +
                '&query=' + encodeURIComponent(query) +
                '&language=' + encodeURIComponent(language) +
                '&t=' + Date.now();

              const response = await fetch(requestUrl, { method: 'GET', cache: 'no-store' });
              if (!response.ok) throw new Error(`TMDB_PROXY_HTTP_${response.status}`);

              const data = await response.json();
              if (data.success === false) throw new Error(data.message || t.reviewMovieSearchError);
              if (isCancelled) return;

              setMovieCandidates((data.results || []).slice(0, 6));
              setHasSearchedCandidates(true);
            } catch (error) {
              if (isCancelled) return;
              console.error('Edit review movie candidate search error:', error);
              setMovieCandidates([]);
              setHasSearchedCandidates(true);
              setCandidateError(t.reviewMovieSearchError);
            } finally {
              if (!isCancelled) setIsCandidateSearching(false);
            }
          }, 550);

          return () => {
            isCancelled = true;
            clearTimeout(timer);
          };
        }, [editingItem?.id, movieTitle, selectedTmdbMovie, appLang]);

        const updateEditingMovie = (movie) => {
          setEditingItem(prev => {
            if (!prev || prev.type !== 'review') return prev;
            return {
              ...prev,
              form: {
                ...prev.form,
                movieTitle: formatTmdbReviewTitle(movie),
                selectedTmdbMovie: movie
              }
            };
          });
          setMovieCandidates([]);
          setCandidateError('');
          setHasSearchedCandidates(false);
        };

        const clearSelectedEditingMovie = () => {
          setEditingItem(prev => {
            if (!prev || prev.type !== 'review') return prev;
            return {
              ...prev,
              form: { ...prev.form, selectedTmdbMovie: null }
            };
          });
          setMovieCandidates([]);
          setCandidateError('');
          setHasSearchedCandidates(false);
        };

        return (
          <div className="flex-1 min-w-0 w-full">
            <div className="relative">
              <input
                type="text"
                required
                autoComplete="off"
                value={movieTitle}
                onChange={e => {
                  const nextTitle = e.target.value;
                  setEditingItem(prev => {
                    if (!prev || prev.type !== 'review') return prev;
                    const selectedTitle = prev.form.selectedTmdbMovie
                      ? formatTmdbReviewTitle(prev.form.selectedTmdbMovie)
                      : '';
                    return {
                      ...prev,
                      form: {
                        ...prev.form,
                        movieTitle: nextTitle,
                        selectedTmdbMovie: selectedTitle && nextTitle === selectedTitle
                          ? prev.form.selectedTmdbMovie
                          : null
                      }
                    };
                  });
                }}
                className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 pr-9 text-sm text-white focus:outline-none focus:border-teal-400"
              />
              {isCandidateSearching && (
                <Loader2 className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 animate-spin text-teal-400" />
              )}
