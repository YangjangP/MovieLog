            </div>

            {selectedTmdbMovie && (
              <div className="mt-2 flex min-w-0 max-w-full flex-wrap items-center gap-3 overflow-hidden rounded-xl border border-teal-500/40 bg-teal-500/10 p-2.5">
                <div className="w-10 h-14 shrink-0 overflow-hidden rounded bg-slate-800 flex items-center justify-center">
                  {selectedTmdbMovie.poster_path ? (
                    <img src={buildTmdbPosterUrl(selectedTmdbMovie.poster_path)} alt="" className="w-full h-full object-cover" />
                  ) : (
                    <Film className="w-4 h-4 text-slate-600" />
                  )}
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-[10px] font-semibold text-teal-400">{t.reviewMovieSelected}</p>
                  <p className="truncate text-xs font-semibold text-slate-200">{selectedTmdbMovie.title || selectedTmdbMovie.original_title}</p>
                  {selectedTmdbMovie.original_title && selectedTmdbMovie.original_title !== selectedTmdbMovie.title && (
                    <p className="mt-0.5 truncate text-[10px] text-slate-500">{selectedTmdbMovie.original_title}</p>
                  )}
                  <p className="mt-0.5 text-[10px] text-slate-500">{selectedTmdbMovie.release_date ? selectedTmdbMovie.release_date.slice(0, 4) : '-'}</p>
                </div>
                <button
                  type="button"
                  onClick={clearSelectedEditingMovie}
                  className="ml-auto max-w-full shrink-0 whitespace-normal break-words rounded-lg border border-slate-700 bg-slate-800 px-2 py-1.5 text-center text-[10px] text-slate-400 hover:border-teal-400 hover:text-teal-400 transition-colors"
                >
                  {t.reviewMovieClearSelection}
                </button>
              </div>
            )}

            {!selectedTmdbMovie && movieCandidates.length > 0 && (
              <div className="mt-2 rounded-xl border border-slate-700 bg-slate-950/70 p-2 shadow-xl">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                  {movieCandidates.map(movie => (
                    <button
                      key={movie.id}
                      type="button"
                      onClick={() => updateEditingMovie(movie)}
                      className="flex min-w-0 items-center gap-2 rounded-lg border border-transparent p-2 text-left hover:border-teal-500/50 hover:bg-slate-800 transition-colors"
                    >
                      <div className="w-9 h-12 shrink-0 overflow-hidden rounded bg-slate-800 flex items-center justify-center">
                        {movie.poster_path ? (
                          <img src={buildTmdbPosterUrl(movie.poster_path)} alt="" className="w-full h-full object-cover" loading="lazy" />
                        ) : (
                          <Film className="w-4 h-4 text-slate-600" />
                        )}
                      </div>
                      <span className="min-w-0">
                        <span className="block truncate text-[11px] font-semibold text-slate-200">{movie.title || movie.original_title}</span>
                        {movie.original_title && movie.original_title !== movie.title && (
                          <span className="mt-0.5 block truncate text-[10px] text-slate-500">{movie.original_title}</span>
                        )}
                        <span className="mt-0.5 block text-[10px] text-slate-500">{movie.release_date ? movie.release_date.slice(0, 4) : '-'}</span>
                      </span>
                    </button>
                  ))}
                </div>
                <p className="px-2 pt-1.5 text-[10px] text-slate-500">{t.reviewMovieManualGuide}</p>
              </div>
            )}

            {!selectedTmdbMovie && hasSearchedCandidates && !isCandidateSearching && movieCandidates.length === 0 && !candidateError && (
              <p className="mt-2 rounded-lg border border-slate-700/70 bg-slate-800/40 px-3 py-2 text-[10px] text-slate-400">{t.reviewMovieNoResults}</p>
            )}
            {!selectedTmdbMovie && candidateError && (
              <p className="mt-2 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-[10px] text-amber-300">{candidateError}</p>
            )}
          </div>
        );
      };

      const ReviewForm = () => {
        const [form, setForm] = useState({ date: todayStr, movieTitle: '', rating: 5.0, comment: '', includeComment: true, hideFromSummary: false });
        const [movieCandidates, setMovieCandidates] = useState([]);
        const [selectedTmdbMovie, setSelectedTmdbMovie] = useState(null);
        const [isCandidateSearching, setIsCandidateSearching] = useState(false);
        const [candidateError, setCandidateError] = useState('');
        const [hasSearchedCandidates, setHasSearchedCandidates] = useState(false);

        useEffect(() => {
          const query = String(form.movieTitle || '').trim();
          const selectedTitle = selectedTmdbMovie ? formatTmdbReviewTitle(selectedTmdbMovie) : '';

          if (selectedTmdbMovie && query === selectedTitle) {
            setMovieCandidates([]);
            setCandidateError('');
            setHasSearchedCandidates(false);
            setIsCandidateSearching(false);
            return;
          }

          if (query.length < 2) {
            setMovieCandidates([]);
            setCandidateError('');
            setHasSearchedCandidates(false);
            setIsCandidateSearching(false);
            return;
          }

          let isCancelled = false;
          const timer = setTimeout(async () => {
            setIsCandidateSearching(true);
            setCandidateError('');

            try {
              const language = appLang === 'ko' ? 'ko-KR' : 'ja-JP';
              const requestUrl =
                SCRIPT_URL +
                '?action=tmdbSearch' +
                '&query=' + encodeURIComponent(query) +
                '&language=' + encodeURIComponent(language) +
                '&t=' + Date.now();

              const response = await fetch(requestUrl, { method: 'GET', cache: 'no-store' });
              if (!response.ok) throw new Error(`TMDB_PROXY_HTTP_${response.status}`);

              const data = await response.json();
              if (data.success === false) throw new Error(data.message || t.reviewMovieSearchError);
              if (isCancelled) return;

              setMovieCandidates((data.results || []).slice(0, 6));
              setHasSearchedCandidates(true);
            } catch (error) {
              if (isCancelled) return;
              console.error('Review movie candidate search error:', error);
              setMovieCandidates([]);
              setHasSearchedCandidates(true);
              setCandidateError(t.reviewMovieSearchError);
            } finally {
              if (!isCancelled) setIsCandidateSearching(false);
            }
          }, 550);

          return () => {
            isCancelled = true;
            clearTimeout(timer);
          };
        }, [form.movieTitle, selectedTmdbMovie, appLang]);

        const selectReviewMovie = (movie) => {
          setSelectedTmdbMovie(movie);
          setForm(prev => ({ ...prev, movieTitle: formatTmdbReviewTitle(movie) }));
          setMovieCandidates([]);
          setCandidateError('');
          setHasSearchedCandidates(false);
        };

        const clearSelectedReviewMovie = () => {
          setSelectedTmdbMovie(null);
          setMovieCandidates([]);
          setCandidateError('');
          setHasSearchedCandidates(false);
        };

        const handleReviewSubmit = async (e) => {
          await submitReview(e, {
            ...form,
            comment: form.includeComment ? form.comment : '',
            selectedTmdbMovie
          });
          setForm(prev => ({ ...prev, movieTitle: '', comment: '', hideFromSummary: false }));
          setSelectedTmdbMovie(null);
          setMovieCandidates([]);
          setCandidateError('');
          setHasSearchedCandidates(false);
        };

        return (
          <div className="mobile-width-safe bg-slate-900 p-4 sm:p-6 rounded-2xl border border-slate-800 shadow-xl mb-8 overflow-hidden">
            <h2 className="text-lg font-semibold mb-4 text-white flex items-center gap-2"><Film className="w-5 h-5 text-teal-400" />새 리뷰 작성</h2>
            <form onSubmit={handleReviewSubmit} className="flex min-w-0 max-w-full flex-col gap-4">
              <div className="flex flex-col sm:flex-row gap-4">
                <div className="flex-1">
                  <label className="block text-xs text-slate-400 mb-1">{t.nickname}</label>
                  <CurrentUserBadge className="w-full" />
                </div>
                <div className="flex-1">
                  <label className="block text-xs text-slate-400 mb-1">{t.date}</label>
                  <input type="date" required value={form.date} onChange={e => setForm({...form, date: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500 [color-scheme:dark]" />
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-4 items-start">
                <div className="flex-1 min-w-0 w-full">
                  <label className="block text-xs text-slate-400 mb-1">{t.movieTitle}</label>
                  <div className="relative">
                    <input
                      type="text"
                      required
                      autoComplete="off"
                      value={form.movieTitle}
                      onChange={e => {
                        const nextTitle = e.target.value;
                        setForm({...form, movieTitle: nextTitle});
                        if (selectedTmdbMovie && nextTitle !== formatTmdbReviewTitle(selectedTmdbMovie)) {
                          setSelectedTmdbMovie(null);
                        }
                      }}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                    />
                    {isCandidateSearching && (
                      <Loader2 className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 animate-spin text-teal-400" />
                    )}
                  </div>

                  {selectedTmdbMovie && (
                    <div className="mt-2 flex min-w-0 max-w-full flex-wrap items-center gap-3 overflow-hidden rounded-xl border border-teal-500/40 bg-teal-500/10 p-2.5">
                      <div className="w-10 h-14 shrink-0 overflow-hidden rounded bg-slate-800 flex items-center justify-center">
                        {selectedTmdbMovie.poster_path ? (
                          <img src={buildTmdbPosterUrl(selectedTmdbMovie.poster_path)} alt="" className="w-full h-full object-cover" />
                        ) : (
                          <Film className="w-4 h-4 text-slate-600" />
                        )}
                      </div>
                      <div className="min-w-0 flex-1">
                        <p className="text-[10px] font-semibold text-teal-400">{t.reviewMovieSelected}</p>
                        <p className="truncate text-xs font-semibold text-slate-200">{selectedTmdbMovie.title || selectedTmdbMovie.original_title}</p>
                        <p className="mt-0.5 text-[10px] text-slate-500">{selectedTmdbMovie.release_date ? selectedTmdbMovie.release_date.slice(0, 4) : '-'}</p>
                      </div>
                      <button type="button" onClick={clearSelectedReviewMovie} className="ml-auto max-w-full shrink-0 whitespace-normal break-words rounded-lg border border-slate-700 bg-slate-800 px-2 py-1.5 text-center text-[10px] text-slate-400 hover:border-teal-400 hover:text-teal-400 transition-colors">
                        {t.reviewMovieClearSelection}
                      </button>
                    </div>
                  )}

                  {!selectedTmdbMovie && movieCandidates.length > 0 && (
                    <div className="mt-2 rounded-xl border border-slate-700 bg-slate-950/70 p-2 shadow-xl">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                        {movieCandidates.map(movie => (
                          <button
                            key={movie.id}
                            type="button"
                            onClick={() => selectReviewMovie(movie)}
                            className="flex min-w-0 items-center gap-2 rounded-lg border border-transparent p-2 text-left hover:border-teal-500/50 hover:bg-slate-800 transition-colors"
                          >
                            <div className="w-9 h-12 shrink-0 overflow-hidden rounded bg-slate-800 flex items-center justify-center">
                              {movie.poster_path ? (
                                <img src={buildTmdbPosterUrl(movie.poster_path)} alt="" className="w-full h-full object-cover" loading="lazy" />
                              ) : (
                                <Film className="w-4 h-4 text-slate-600" />
                              )}
                            </div>
                            <span className="min-w-0">
                              <span className="block truncate text-[11px] font-semibold text-slate-200">{movie.title || movie.original_title}</span>
                              {movie.original_title && movie.original_title !== movie.title && (
                                <span className="mt-0.5 block truncate text-[10px] text-slate-500">{movie.original_title}</span>
                              )}
                              <span className="mt-0.5 block text-[10px] text-slate-500">{movie.release_date ? movie.release_date.slice(0, 4) : '-'}</span>
                            </span>
                          </button>
                        ))}
                      </div>
                      <p className="px-2 pt-1.5 text-[10px] text-slate-500">{t.reviewMovieManualGuide}</p>
                    </div>
                  )}

                  {!selectedTmdbMovie && hasSearchedCandidates && !isCandidateSearching && movieCandidates.length === 0 && !candidateError && (
                    <p className="mt-2 rounded-lg border border-slate-700/70 bg-slate-800/40 px-3 py-2 text-[10px] text-slate-400">{t.reviewMovieNoResults}</p>
                  )}
                  {!selectedTmdbMovie && candidateError && (
                    <p className="mt-2 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-[10px] text-amber-300">{candidateError}</p>
                  )}
                </div>

                <div className="flex-1 w-full">
                  <label className="block text-xs text-slate-400 mb-1 flex justify-between"><span>{t.rating}</span><span className="text-teal-400">{form.rating}</span></label>
                  <input type="range" min="0.5" max="5" step="0.5" value={form.rating} onChange={e => setForm({...form, rating: e.target.value})} className="w-full accent-teal-500 mb-2" />
                  <div className="flex justify-center bg-slate-800/40 py-1.5 rounded-lg">{renderStars(parseFloat(form.rating))}</div>
                </div>
              </div>

              <div className="flex flex-col">
                <div className="flex min-w-0 flex-wrap items-center justify-between gap-2 mb-1">
                  <label className="block text-xs text-slate-400">{t.comment}</label>
                  <button
                    type="button"
                    role="switch"
                    aria-checked={form.includeComment}
                    onClick={() => setForm({...form, includeComment: !form.includeComment})}
                    className="flex min-w-0 max-w-full items-center gap-2 text-[11px] text-slate-400 hover:text-slate-200 transition-colors"
                  >
                    <span className="min-w-0 break-words text-right">{form.includeComment ? t.commentEnabled : t.commentDisabled}</span>
                    <span className={`relative inline-flex h-5 w-9 shrink-0 rounded-full transition-colors ${form.includeComment ? 'bg-teal-500' : 'bg-slate-700'}`}>
                      <span className={`absolute top-0.5 h-4 w-4 rounded-full bg-white shadow-sm transition-transform ${form.includeComment ? 'translate-x-[18px]' : 'translate-x-0.5'}`}></span>
                    </span>
                  </button>
                </div>

                {form.includeComment ? (
                  <>
                    <p className="text-[10px] text-teal-400/80 mb-2">{t.commentDesc}</p>
                    <textarea
                      required
                      placeholder={t.placeholderReview}
                      value={form.comment}
                      onChange={e => setForm({...form, comment: e.target.value})}
                      className="flex-1 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500 resize-y min-h-[120px] mb-3"
                      rows="5"
                    />
                  </>
                ) : (
                  <div className="mb-3 rounded-lg border border-slate-700/70 bg-slate-800/40 px-3 py-3 text-xs text-slate-400 leading-relaxed">
                    {t.commentSkipGuide}
                  </div>
                )}

                <label className={`mb-3 flex cursor-pointer items-start gap-2.5 rounded-lg border px-3 py-2.5 transition-colors ${form.hideFromSummary ? 'border-teal-500/40 bg-teal-500/5' : 'border-slate-800 bg-slate-900/30 hover:border-slate-700'}`}>
                  <input
                    type="checkbox"
                    checked={form.hideFromSummary}
                    onChange={e => setForm({...form, hideFromSummary: e.target.checked})}
                    className="peer sr-only"
                  />
                  <span className={`mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded border transition-colors ${form.hideFromSummary ? 'border-teal-500 bg-teal-500 text-slate-950' : 'border-slate-600 bg-slate-800 text-transparent'}`}>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="h-3 w-3">
                      <path d="m5 12 4 4L19 6" />
                    </svg>
                  </span>
                  <span className="min-w-0">
                    <span className={`block text-xs font-medium transition-colors ${form.hideFromSummary ? 'text-teal-300' : 'text-slate-400'}`}>{t.hideFromSummary}</span>
                    <span className="mt-0.5 block text-[10px] leading-relaxed text-slate-500">{t.hideFromSummaryGuide}</span>
                  </span>
                </label>

                <button type="submit" disabled={isSubmitting} className="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-3 rounded-lg flex justify-center items-center gap-2">
                  {isSubmitting ? <><Loader2 className="w-4 h-4 animate-spin" /> {t.saving}</> : <><Send className="w-4 h-4" /> {t.submit}</>}
                </button>
              </div>
            </form>
          </div>
        );
      };
      const BoardForm = ({ type }) => {
        const [form, setForm] = useState({ title: '', content: '' });
        return (
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 mb-6">
            <h3 className="font-semibold text-white mb-3">{t.writePost}</h3>
            <form onSubmit={e => submitPost(e, form, type).then(() => setForm({...form, title: '', content: ''}))} className="space-y-3">
              <div className="flex flex-col sm:flex-row gap-3">
                <CurrentUserBadge className="w-full sm:w-auto" />
                <input type="text" required placeholder={t.postTitle} value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" />
              </div>
              <textarea required placeholder={t.postContent} rows="5" value={form.content} onChange={e => setForm({...form, content: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-sm text-white min-h-[120px] resize-y" />
              <button type="submit" disabled={isSubmitting} className="bg-teal-500 text-slate-950 font-bold py-3 px-4 rounded-lg w-full text-sm flex justify-center items-center gap-2">
                {isSubmitting ? <><Loader2 className="w-4 h-4 animate-spin" /> {t.saving}</> : t.submit}
              </button>
            </form>
          </div>
        );
      };

      const FeedbackForm = () => {
        const [form, setForm] = useState({
          type: 'suggestion',
          nickname: currentUser,
          content: ''
        });
        const [feedbackStatus, setFeedbackStatus] = useState('idle');

        const handleSubmit = async (e) => {
          e.preventDefault();
          setFeedbackStatus('idle');
          try {
            await submitFeedback(form);
            setForm(prev => ({ ...prev, content: '' }));
            setFeedbackStatus('success');
          } catch (error) {
            console.error('Error sending feedback:', error);
            setFeedbackStatus('error');
          }
        };

        return (
          <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-7 shadow-xl">
              <div className="flex items-start gap-3 mb-6">
                <div className="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center shrink-0">
                  <Lightbulb className="w-5 h-5" />
                </div>
                <div>
                  <h2 className="text-xl font-bold text-white">{t.feedbackTitle}</h2>
                  <p className="mt-1 text-sm text-slate-400 leading-relaxed">{t.feedbackIntro}</p>
                </div>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1.5">{t.feedbackType}</label>
                    <select
                      value={form.type}
                      onChange={e => setForm({ ...form, type: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                    >
                      <option value="bug">{t.feedbackBug}</option>
                      <option value="suggestion">{t.feedbackSuggestion}</option>
                      <option value="other">{t.feedbackOther}</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1.5">{t.feedbackNickname}</label>
                    <select
                      value={form.nickname}
                      onChange={e => setForm({ ...form, nickname: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500"
                    >
                      <option value={currentUser}>{USER_EMOJIS[currentUser]} {currentUser}</option>
                      <option value="Anonymous">{appLang === 'ko' ? '익명' : '匿名'}</option>
                    </select>
                  </div>
                </div>


                <div>
                  <label className="block text-xs text-slate-400 mb-1.5">{t.feedbackContent}</label>
                  <textarea
                    required
                    minLength="5"
                    rows="8"
                    value={form.content}
                    onChange={e => setForm({ ...form, content: e.target.value })}
                    placeholder={t.feedbackPlaceholder}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-teal-500 resize-y min-h-[180px]"
                  />
                </div>

                {feedbackStatus === 'success' && (
                  <div className="rounded-lg border border-teal-500/40 bg-teal-500/5 px-3 py-2.5 text-sm text-teal-400">
                    {t.feedbackSuccess}
                  </div>
                )}
                {feedbackStatus === 'error' && (
                  <div className="rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2.5 text-sm text-red-400">
                    {t.feedbackError}
                  </div>
                )}

                <button
                  type="submit"
                  disabled={isSubmitting || !form.content.trim()}
                  className="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-3 rounded-lg flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {isSubmitting ? <><Loader2 className="w-4 h-4 animate-spin" /> {t.feedbackSending}</> : <><Send className="w-4 h-4" /> {t.feedbackSubmit}</>}
                </button>
              </form>
            </div>
          </div>
        );
      };

      const renderSummary = () => {
        const weekReviews = appData.reviews.filter(r =>
          Number(r.week) === Number(selectedWeek) &&
          !parseBoolean(getNormalizedField(r, 'hideFromSummary', 'HideFromSummary'))
        );
        const weekOptions = Array.from({length: currentWeekNum}, (_, i) => currentWeekNum - i);

        return (
          <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
            <ReviewForm />
            
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 mt-8">
              <div className="flex items-center gap-2">
                <CalendarDays className="w-6 h-6 text-teal-400" />
                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                  <span className="bg-teal-400/20 text-teal-400 px-3 py-1 rounded-lg">Week {selectedWeek}</span>
                  {t.currentWeekSummary}
                </h2>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <label className="text-sm text-slate-400">주차 선택:</label>
                <select
                  value={selectedWeek}
                  onChange={e => setSelectedWeek(Number(e.target.value))}
                  className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-teal-400 cursor-pointer"
                >
                  {weekOptions.map(w => (
                    <option key={w} value={w}>
                      Week {w} {w === currentWeekNum ? '(이번 주)' : ''}
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="mb-4 -mt-2 flex items-center gap-1.5 px-1 text-[11px] leading-relaxed text-slate-500 sm:text-xs">
              <span className="shrink-0 text-teal-400" aria-hidden="true">ⓘ</span>
              <span>{t.movieInfoSummaryGuide}</span>
            </div>
            
            {weekReviews.length === 0 ? (
              <div className="text-center py-10 text-slate-500 border border-dashed border-slate-700 rounded-xl bg-slate-900/50">{t.noData}</div>
            ) : (
              <div className="grid gap-6">
                {weekReviews.map(r => (
                  <div key={r.id} className="review-card-safe bg-slate-900 border border-slate-800 p-4 sm:p-5 rounded-2xl shadow-lg relative group">
                    {editingItem?.id === r.id ? (
                      <form onSubmit={handleEditSave} className="space-y-3 mb-4">
                        <div className="flex flex-col sm:flex-row gap-2">
                          <CurrentUserBadge className="w-full sm:w-auto py-1.5" />
                          <input type="date" required value={editingItem.form.date} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, date: e.target.value } })} className="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:border-teal-400" />
                          <ReviewMovieEditField />
                        </div>
                        <div className="flex items-center gap-4 bg-slate-800/30 p-2 rounded">
                           <span className="text-teal-400 text-sm font-bold w-6">{editingItem.form.rating}</span>
                           <input type="range" min="0.5" max="5" step="0.5" value={editingItem.form.rating} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, rating: e.target.value } })} className="flex-1 accent-teal-500" />
                           <div className="flex justify-center">{renderStars(parseFloat(editingItem.form.rating))}</div>
                        </div>
                        <textarea placeholder={t.placeholderReview} value={editingItem.form.comment || ''} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, comment: e.target.value } })} className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white resize-y min-h-[120px] focus:border-teal-400" rows="5" />
                        <label className={`flex cursor-pointer items-start gap-2.5 rounded-lg border px-3 py-2.5 transition-colors ${editingItem.form.hideFromSummary ? 'border-teal-500/40 bg-teal-500/5' : 'border-slate-700 bg-slate-800/30 hover:border-slate-600'}`}>
                          <input
                            type="checkbox"
                            checked={!!editingItem.form.hideFromSummary}
                            onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, hideFromSummary: e.target.checked } })}
                            className="peer sr-only"
                          />
                          <span className={`mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded border transition-colors ${editingItem.form.hideFromSummary ? 'border-teal-500 bg-teal-500 text-slate-950' : 'border-slate-600 bg-slate-800 text-transparent'}`}>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="h-3 w-3">
                              <path d="m5 12 4 4L19 6" />
                            </svg>
                          </span>
                          <span className="min-w-0">
                            <span className={`block text-xs font-medium transition-colors ${editingItem.form.hideFromSummary ? 'text-teal-300' : 'text-slate-400'}`}>{t.hideFromSummary}</span>
                            <span className="mt-0.5 block text-[10px] leading-relaxed text-slate-500">{t.hideFromSummaryGuide}</span>
                          </span>
                        </label>
                        <div className="flex justify-end gap-2">
                          <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-1.5 text-sm bg-slate-700 rounded hover:bg-slate-600 transition-colors">{t.cancel}</button>
                          <button type="submit" disabled={isSubmitting} className="px-4 py-1.5 text-sm bg-teal-500 text-slate-900 font-bold rounded hover:bg-teal-400 transition-colors">{t.save}</button>
                        </div>
                      </form>
                    ) : (
                      <>
                        {/* ✨ 모바일 최적화: pr-16 제거하고 제목 아래로 쏙 들어가게 수정 ✨ */}
                        <div className="review-card-head grid grid-cols-[minmax(0,1fr)_auto] items-start mb-3 gap-2 sm:gap-3">
                          <div className="min-w-0 flex-1">
                            <h3 className="min-w-0 max-w-full text-base sm:text-lg font-bold text-white break-all leading-tight"><MovieTitleButton review={r} /></h3>
                            <div className="flex flex-wrap gap-2 text-[11px] sm:text-xs text-slate-400 items-center mt-1.5">
                              <span className="bg-slate-800 px-2 py-0.5 rounded flex items-center gap-1 shrink-0">{USER_EMOJIS[r.nickname]} {r.nickname}</span>
                              <span className="shrink-0">{formatDateOnly(r.date)} (Week {r.week})</span>
                              {/* 로그인한 작성자에게만 수정/삭제 버튼을 표시합니다. */}
                              {isOwner(r) && (
                                <div className="flex gap-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity ml-auto sm:ml-1 shrink-0">
                                  <button onClick={() => setEditingItem({ id: r.id, type: 'review', form: { date: formatDateOnly(r.date), movieTitle: r.movieTitle, rating: r.rating, comment: appLang === 'ko' ? r.commentKo : r.commentJp, hideFromSummary: !!r.hideFromSummary } })} className="text-slate-400 hover:text-teal-400 p-1"><Edit2 className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                  <button onClick={() => requestDelete(r.id, 'review')} className="text-slate-400 hover:text-red-400 p-1"><Trash2 className="w-3.5 h-3.5 sm:w-4 sm:h-4" /></button>
                                </div>
                              )}
                            </div>
                          </div>
                          {/* 별점 영역 최적화 (모바일에서 조금 더 작게) */}
                          <div className="bg-slate-800/80 px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg text-center shrink-0 flex flex-col items-center justify-center border border-slate-700/50 shadow-inner">
                            <div className="text-base sm:text-lg font-bold text-yellow-400 leading-none mb-0.5 sm:mb-1">{r.rating}</div>
                            {renderStars(r.rating)}
                          </div>
                        </div>
                        {((appLang === 'ko' ? r.commentKo : r.commentJp) || '').trim() && (
                          <SpoilerText text={appLang === 'ko' ? r.commentKo : r.commentJp} className="mobile-break-anywhere block w-full min-w-0 max-w-full text-left text-slate-300 text-sm mt-3 whitespace-pre-wrap break-all leading-relaxed" />
                        )}
                      </>
                    )}
                    <CommentSection parentId={r.id} parentType="review" />
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      const renderBoard = (type) => {
        if (selectedPost) {
          const p = selectedPost;
          return (
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg animate-in slide-in-from-right-4 relative group">
              <button onClick={() => setSelectedPost(null)} className="text-teal-400 text-sm mb-4 hover:underline flex items-center gap-1">← {t.backToList}</button>
              
              {editingItem?.id === p.id ? (
                <form onSubmit={handleEditSave} className="space-y-3 mb-6">
                   <div className="flex flex-col sm:flex-row gap-2">
                     <CurrentUserBadge className="w-full sm:w-auto" />
                     <input type="text" required value={editingItem.form.title} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, title: e.target.value } })} className="flex-1 bg-slate-800 border border-slate-700 rounded px-3 py-2 text-white focus:border-teal-400" />
                   </div>
                   <textarea required value={editingItem.form.content} onChange={e => setEditingItem({ ...editingItem, form: { ...editingItem.form, content: e.target.value } })} className="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-white min-h-[150px] resize-y focus:border-teal-400" rows="6" />
                   <div className="flex justify-end gap-2">
                     <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-1.5 text-sm bg-slate-700 rounded hover:bg-slate-600 transition-colors">{t.cancel}</button>
                     <button type="submit" disabled={isSubmitting} className="px-4 py-1.5 text-sm bg-teal-500 text-slate-900 font-bold rounded hover:bg-teal-400 transition-colors">{t.save}</button>
                   </div>
                </form>
              ) : (
                <>
                  {/* ✨ 게시글 뷰 인라인 배치 ✨ */}
                  <div className="mb-4">
                    <h2 className="text-xl sm:text-2xl font-bold text-white mb-3 break-words">{appLang === 'ko' ? p.titleKo : p.titleJp}</h2>
                    <div className="text-sm text-slate-400 flex flex-wrap gap-3 items-center border-b border-slate-800 pb-4">
                      <span className="flex items-center gap-1">{USER_EMOJIS[p.nickname]} {p.nickname}</span>
                      <span>{formatKSTDate(p.createdAt)}</span>
                      {isOwner(p) && (
                        <div className="flex gap-1 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity ml-auto">
                          <button onClick={() => setEditingItem({ id: p.id, type: 'post', form: { title: appLang === 'ko' ? p.titleKo : p.titleJp, content: appLang === 'ko' ? p.contentKo : p.contentJp } })} className="text-slate-400 hover:text-teal-400 p-1.5"><Edit2 className="w-4 h-4" /></button>
                          <button onClick={() => requestDelete(p.id, 'post')} className="text-slate-400 hover:text-red-400 p-1.5"><Trash2 className="w-4 h-4" /></button>
                        </div>
                      )}
                    </div>
                  </div>
                  <SpoilerText text={appLang === 'ko' ? p.contentKo : p.contentJp} className="block text-left text-slate-200 whitespace-pre-wrap min-h-[100px] mb-8 break-words leading-relaxed" />
                </>
              )}
              <CommentSection parentId={p.id} parentType="post" />
            </div>
          );
        }

        const filteredPosts = appData.posts.filter(p => p.type === type);
        return (
          <div className="animate-in fade-in duration-500">
            <BoardForm type={type} />
            <div className="space-y-3">
              {filteredPosts.length === 0 ? (
                 <div className="text-center py-10 text-slate-500">{t.noData}</div>
              ) : (
                filteredPosts.map(p => {
                  const commentCount = appData.comments.filter(c => c.parentId === p.id).length;
                  return (
                    <div key={p.id} onClick={() => setSelectedPost(p)} className="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-teal-500 transition-colors flex justify-between items-center group gap-3">
                      <div className="min-w-0 flex-1">
                        <h4 className="text-slate-200 font-medium group-hover:text-teal-400 transition-colors truncate">{appLang === 'ko' ? p.titleKo : p.titleJp}</h4>
                        <span className="text-xs text-slate-500 mt-1 flex items-center gap-1 truncate">{USER_EMOJIS[p.nickname]} {p.nickname} · {formatKSTDate(p.createdAt)}</span>
                      </div>
                      {commentCount > 0 && (
                        <span className="flex items-center gap-1 text-xs bg-slate-800 text-teal-400 px-2 py-1 rounded-full shrink-0"><MessageSquare className="w-3 h-3"/> {commentCount}</span>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          </div>
        );
      };

      const renderBoardHub = () => {
        const boardItems = [
          { id: 'notice', icon: Megaphone, label: t.navNotice, description: t.boardNoticeDesc },
          { id: 'forum', icon: MessageSquare, label: t.navForum, description: t.boardForumDesc },
          { id: 'feedback', icon: Lightbulb, label: t.navFeedback, description: t.boardFeedbackDesc }
        ];

        if (!boardSection) {
          return (
            <div className="animate-in fade-in slide-in-from-bottom-3 duration-300">
              <div className="mb-5">
                <h2 className="text-xl sm:text-2xl font-bold text-white">{t.boardTitle}</h2>
                <p className="mt-1 text-sm text-slate-400">{t.boardIntro}</p>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
                {boardItems.map(item => (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => {
                      setBoardSection(item.id);
                      setSelectedPost(null);
                      setEditingItem(null);
                    }}
                    className="group rounded-2xl border border-slate-800 bg-slate-900 p-5 text-left shadow-lg transition-all hover:-translate-y-0.5 hover:border-teal-500/60 hover:bg-slate-900/80"
                  >
                    <span className="mb-4 flex h-10 w-10 items-center justify-center rounded-xl bg-slate-800 text-teal-400 transition-colors group-hover:bg-teal-500/15">
                      <item.icon className="h-5 w-5" />
                    </span>
                    <span className="block text-base font-bold text-slate-200 transition-colors group-hover:text-teal-400">{item.label}</span>
                    <span className="mt-1.5 block text-xs leading-relaxed text-slate-500">{item.description}</span>
                  </button>
                ))}
              </div>
            </div>
          );
        }

        return (
          <div className="animate-in fade-in duration-300">
            <div className="board-subnav mb-5 flex gap-1 overflow-x-auto rounded-xl border border-slate-800 bg-slate-900/60 p-1">
              {boardItems.map(item => (
                <button
                  key={item.id}
                  type="button"
                  onClick={() => {
                    setBoardSection(item.id);
                    setSelectedPost(null);
                    setEditingItem(null);
                  }}
                  className={`flex min-w-max flex-1 items-center justify-center gap-2 rounded-lg px-3 py-2 text-xs sm:text-sm transition-colors ${boardSection === item.id ? 'bg-teal-500 text-slate-950 font-bold' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                >
                  <item.icon className="h-4 w-4" /> {item.label}
                </button>
              ))}
            </div>
            {boardSection === 'notice' && renderBoard('notice')}
            {boardSection === 'forum' && renderBoard('forum')}
            {boardSection === 'feedback' && <FeedbackForm />}
          </div>
        );
      };

      const renderAlbum = () => {
        const albumMovies = getAlbumMovieGroups();
        const normalizedAlbumSearch = normalizeMovieTitleToken(albumSearch);
        const filteredAlbumMovies = selectedAlbumMovie
          ? albumMovies.filter(movieGroup => albumGroupMatchesTmdbMovie(movieGroup, selectedAlbumMovie))
          : normalizedAlbumSearch
            ? albumMovies.filter(movieGroup =>
                Array.from(movieGroup.aliases).some(alias => alias.includes(normalizedAlbumSearch)) ||
                normalizeMovieTitleToken(movieGroup.representative?.movieTitle).includes(normalizedAlbumSearch)
              )
            : albumMovies;

        return (
          <div className="animate-in fade-in slide-in-from-bottom-3 duration-400">
            <div className="mb-5 flex flex-wrap items-end justify-between gap-3">
              <div>
                <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                  <Film className="h-6 w-6 text-teal-400" /> {t.albumTitle}
                </h2>
                <p className="mt-1 text-sm text-slate-400">{t.albumIntro}</p>
              </div>
              <span className="rounded-full border border-slate-700 bg-slate-900 px-3 py-1 text-xs text-slate-400">
                {(selectedAlbumMovie || normalizedAlbumSearch)
                  ? `${filteredAlbumMovies.length} / ${albumMovies.length}${t.albumMovieCount}`
                  : `${albumMovies.length}${t.albumMovieCount}`}
              </span>
            </div>

            {albumMovies.length > 0 && (
              <div className="mb-6">
                <div className="relative">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
                  >
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                  </svg>
                  <input
                    type="search"
                    autoComplete="off"
                    value={albumSearch}
                    onChange={e => {
                      const nextQuery = e.target.value;
                      setAlbumSearch(nextQuery);
                      if (selectedAlbumMovie && nextQuery !== formatTmdbReviewTitle(selectedAlbumMovie)) {
                        setSelectedAlbumMovie(null);
                      }
                    }}
                    placeholder={t.albumSearchPlaceholder}
                    className="w-full rounded-xl border border-slate-700 bg-slate-900 py-3 pl-10 pr-11 text-sm text-white shadow-sm outline-none transition-colors placeholder:text-slate-500 focus:border-teal-400 focus:ring-1 focus:ring-teal-500"
                  />
                  {isAlbumTmdbSearching && (
                    <Loader2 className="pointer-events-none absolute right-3.5 top-1/2 h-4 w-4 -translate-y-1/2 animate-spin text-teal-400" />
                  )}
                  {albumSearch && !isAlbumTmdbSearching && (
                    <button
                      type="button"
                      onClick={clearAlbumMovieSearch}
                      className="absolute right-2.5 top-1/2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-full text-slate-500 transition-colors hover:bg-slate-800 hover:text-white"
                      aria-label={t.cancel}
                      title={t.cancel}
                    >
                      <X className="h-4 w-4" />
                    </button>
                  )}
                </div>

                {selectedAlbumMovie && (
                  <div className="mt-2 flex min-w-0 max-w-full flex-wrap items-center gap-3 overflow-hidden rounded-xl border border-teal-500/40 bg-teal-500/10 p-2.5">
                    <div className="flex h-14 w-10 shrink-0 items-center justify-center overflow-hidden rounded bg-slate-800">
                      {selectedAlbumMovie.poster_path ? (
                        <img
                          src={buildTmdbPosterUrl(selectedAlbumMovie.poster_path)}
                          alt=""
                          className="h-full w-full object-cover"
                        />
                      ) : (
                        <Film className="h-4 w-4 text-slate-600" />
                      )}
                    </div>
                    <div className="min-w-0 flex-1">
                      <p className="text-[10px] font-semibold text-teal-400">{t.albumSearchSelected}</p>
                      <p className="truncate text-xs font-semibold text-slate-200">{selectedAlbumMovie.title || selectedAlbumMovie.original_title}</p>
                      {selectedAlbumMovie.original_title && selectedAlbumMovie.original_title !== selectedAlbumMovie.title && (
                        <p className="mt-0.5 truncate text-[10px] text-slate-500">{selectedAlbumMovie.original_title}</p>
                      )}
                      <p className="mt-0.5 text-[10px] text-slate-500">{selectedAlbumMovie.release_date ? selectedAlbumMovie.release_date.slice(0, 4) : '-'}</p>
                    </div>
                    <button
                      type="button"
                      onClick={clearAlbumMovieSearch}
                      className="ml-auto max-w-full shrink-0 whitespace-normal break-words rounded-lg border border-slate-700 bg-slate-800 px-2 py-1.5 text-center text-[10px] text-slate-400 transition-colors hover:border-teal-400 hover:text-teal-400"
                    >
                      {t.albumSearchClearSelection}
                    </button>
                  </div>
                )}

                {!selectedAlbumMovie && albumTmdbResults.length > 0 && (
                  <div className="mt-2 rounded-xl border border-slate-700 bg-slate-950/90 p-2 shadow-xl">
                    <div className="grid grid-cols-1 gap-1.5 sm:grid-cols-2">
                      {albumTmdbResults.map(movie => (
                        <button
                          key={movie.id}
                          type="button"
                          onClick={() => selectAlbumMovie(movie)}
                          className="flex min-w-0 items-center gap-2 rounded-lg border border-transparent p-2 text-left transition-colors hover:border-teal-500/50 hover:bg-slate-800"
                        >
                          <div className="flex h-12 w-9 shrink-0 items-center justify-center overflow-hidden rounded bg-slate-800">
                            {movie.poster_path ? (
                              <img
                                src={buildTmdbPosterUrl(movie.poster_path)}
                                alt=""
                                className="h-full w-full object-cover"
                                loading="lazy"
                              />
                            ) : (
                              <Film className="h-4 w-4 text-slate-600" />
                            )}
                          </div>
                          <span className="min-w-0">
                            <span className="block truncate text-[11px] font-semibold text-slate-200">{movie.title || movie.original_title}</span>
                            {movie.original_title && movie.original_title !== movie.title && (
                              <span className="mt-0.5 block truncate text-[10px] text-slate-500">{movie.original_title}</span>
                            )}
                            <span className="mt-0.5 block text-[10px] text-slate-500">{movie.release_date ? movie.release_date.slice(0, 4) : '-'}</span>
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {!selectedAlbumMovie && hasAlbumTmdbSearched && !isAlbumTmdbSearching && albumTmdbResults.length === 0 && !albumTmdbError && (
                  <p className="mt-2 rounded-lg border border-slate-700/70 bg-slate-800/40 px-3 py-2 text-[10px] text-slate-400">{t.albumTmdbNoResults}</p>
                )}
                {!selectedAlbumMovie && albumTmdbError && (
                  <p className="mt-2 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-[10px] text-amber-300">{albumTmdbError}</p>
                )}
              </div>
            )}

            {albumMovies.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-slate-700 bg-slate-900/50 py-14 text-center text-sm text-slate-500">
                {t.albumNoMovies}
              </div>
            ) : filteredAlbumMovies.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-slate-700 bg-slate-900/50 py-14 text-center text-sm text-slate-500">
                {selectedAlbumMovie ? t.albumNotWatched : t.albumNoSearchResults}
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-x-3 gap-y-6 sm:grid-cols-3 sm:gap-x-5 md:grid-cols-4 lg:grid-cols-5">
                {filteredAlbumMovies.map(movieGroup => {
                  const review = movieGroup.representative;
                  return (
                    <button
                      key={movieGroup.id}
                      type="button"
                      onClick={() => openMovieInfo(review)}
                      className="group min-w-0 text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-400/70 focus-visible:ring-offset-4 focus-visible:ring-offset-slate-950 rounded-lg"
                      title={t.albumOpenMovie}
                      aria-label={`${review.movieTitle} - ${t.albumOpenMovie}`}
                    >
                      <div className="relative rounded-[10px] border-[3px] border-slate-700 bg-slate-950 p-1.5 shadow-[5px_7px_0_rgba(0,0,0,0.32)] transition-all duration-200 group-hover:-translate-y-1 group-hover:border-teal-500/70 group-hover:shadow-[7px_10px_0_rgba(0,0,0,0.38)]">
                        <div className="absolute inset-y-2 left-1 w-1 rounded-full bg-slate-800 shadow-inner"></div>
                        <div className="relative ml-1.5 aspect-[2/3] overflow-hidden rounded-[5px] border border-slate-700 bg-slate-900">
                          {movieGroup.posterUrl ? (
                            <img
                              src={movieGroup.posterUrl}
                              alt={`${review.movieTitle} poster`}
                              className="h-full w-full object-cover transition-transform duration-300 group-hover:scale-[1.025]"
                              loading="lazy"
                              referrerPolicy="no-referrer"
                              onError={e => { e.currentTarget.style.display = 'none'; }}
                            />
                          ) : (
                            <div className="flex h-full w-full flex-col items-center justify-center gap-2 bg-gradient-to-br from-slate-800 to-slate-950 px-3 text-center">
                              <Film className="h-8 w-8 text-slate-600" />
                              <span className="text-[10px] tracking-[0.18em] text-slate-500">{t.albumNoPoster}</span>
                            </div>
                          )}
                          <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent px-2 pb-2 pt-8">
                            <p className="album-movie-title line-clamp-2 text-[10px] sm:text-xs font-semibold leading-tight text-white">{review.movieTitle}</p>
                          </div>
                          <span className="absolute left-1.5 top-1.5 h-1.5 w-1.5 rounded-full border border-white/20 bg-black/40"></span>
                          <span className="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full border border-white/20 bg-black/40"></span>
                        </div>
                        <div className="mt-1.5 flex items-center justify-between gap-1 rounded bg-slate-900 px-1.5 py-1">
                          <span className="truncate text-[9px] text-slate-500">VHS · MOVIE LOG</span>
                          <span className="shrink-0 text-[10px] font-bold text-yellow-400">★ {movieGroup.average.toFixed(1)}</span>
                        </div>
                      </div>
                      <div className="mt-2 flex items-center justify-between gap-2 px-0.5">
                        <span className="truncate text-[10px] text-slate-500">{movieGroup.memberCount}{t.movieLogViewerUnit}</span>
                        <span className="shrink-0 text-[10px] text-teal-400 opacity-0 transition-opacity group-hover:opacity-100">ⓘ</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      const moveCalendarMonth = (amount) => {
        setCalendarCursor(prev => new Date(prev.getFullYear(), prev.getMonth() + amount, 1));
      };

      const goToCurrentMonth = () => {
        const now = new Date();
        setCalendarCursor(new Date(now.getFullYear(), now.getMonth(), 1));
      };

      const openUserProfile = (name) => {
        const reviews = appData.reviews
          .filter(r => r.nickname === name && r.date)
          .sort((a, b) => formatDateOnly(b.date).localeCompare(formatDateOnly(a.date)));

        if (reviews.length > 0) {
          const [year, month] = formatDateOnly(reviews[0].date).split('-').map(Number);
          setCalendarCursor(new Date(year, month - 1, 1));
        } else {
          goToCurrentMonth();
        }

        setSelectedUser(name);
        setUserViewMode('default');
        setRatingSortOrder('desc');
        setExpandedReviews({});
        setGenreStats(null);
        setGenreStatsError('');
        setIsGenreStatsLoading(false);
      };

      const renderUserCalendar = (userReviews) => {
        const missingPosterCount = userReviews.filter(review =>
          isOwner(review) && !getPosterUrl(review)
        ).length;
        const canAutoFillPosters = selectedUser === currentUser;
        const year = calendarCursor.getFullYear();
        const month = calendarCursor.getMonth();
        const firstWeekday = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPreviousMonth = new Date(year, month, 0).getDate();
        const weekdayLabels = appLang === 'ko'
          ? ['일', '월', '화', '수', '목', '금', '토']
          : ['日', '月', '火', '水', '木', '金', '土'];
        const monthLabel = new Intl.DateTimeFormat(appLang === 'ko' ? 'ko-KR' : 'ja-JP', {
          year: 'numeric',
          month: 'long'
        }).format(calendarCursor);
        const pad = value => String(value).padStart(2, '0');
        const todayKey = formatDateOnly(new Date().toISOString());

        const reviewsByDate = userReviews.reduce((acc, review) => {
          const key = formatDateOnly(review.date);
          if (!acc[key]) acc[key] = [];
          acc[key].push(review);
          return acc;
        }, {});

        // 해당 달의 마지막 날짜가 포함된 주까지만 표시합니다.
        // 달력은 필요한 경우에만 4주, 5주 또는 6주로 자동 조정됩니다.
        const calendarCellCount = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

        const cells = Array.from({ length: calendarCellCount }, (_, index) => {
          const relativeDay = index - firstWeekday + 1;
          let cellYear = year;
          let cellMonth = month;
          let day = relativeDay;
          let isCurrentMonth = true;

          if (relativeDay < 1) {
            cellMonth = month - 1;
            if (cellMonth < 0) {
              cellMonth = 11;
              cellYear -= 1;
            }
            day = daysInPreviousMonth + relativeDay;
            isCurrentMonth = false;
          } else if (relativeDay > daysInMonth) {
            cellMonth = month + 1;
            if (cellMonth > 11) {
              cellMonth = 0;
              cellYear += 1;
            }
            day = relativeDay - daysInMonth;
            isCurrentMonth = false;
          }

          const dateKey = `${cellYear}-${pad(cellMonth + 1)}-${pad(day)}`;
          return { day, dateKey, isCurrentMonth, reviews: reviewsByDate[dateKey] || [] };
        });

        return (
          <div className="animate-in fade-in duration-300">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => moveCalendarMonth(-1)}
                  className="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 hover:border-teal-400 hover:text-teal-400 transition-colors"
                  aria-label={t.previousMonth}
                  title={t.previousMonth}
                >
                  ‹
                </button>
                <h3 className="min-w-[132px] text-center text-lg font-bold text-white">{monthLabel}</h3>
                <button
                  type="button"
                  onClick={() => moveCalendarMonth(1)}
                  className="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 hover:border-teal-400 hover:text-teal-400 transition-colors"
                  aria-label={t.nextMonth}
                  title={t.nextMonth}
                >
                  ›
                </button>
              </div>
              <div className="flex flex-wrap items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={goToCurrentMonth}
                  className="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs text-slate-300 hover:text-teal-400 hover:border-teal-400 transition-colors"
                >
                  {t.goToday}
                </button>
                {canAutoFillPosters && (
                  <button
                    type="button"
                    onClick={() => autoFillMissingPosters(userReviews)}
                    disabled={posterBackfill.isRunning || missingPosterCount === 0}
                    className="px-3 py-2 rounded-lg bg-teal-500 text-slate-950 border border-teal-400 text-xs font-bold hover:bg-teal-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-1.5"
                    title={t.autoPosterGuide}
                  >
                    {posterBackfill.isRunning && <Loader2 className="w-3.5 h-3.5 animate-spin" />}
                    {posterBackfill.isRunning
                      ? `${t.autoPosterFilling} ${posterBackfill.processed}/${posterBackfill.total}`
                      : `${t.autoPosterFill} (${missingPosterCount})`}
                  </button>
                )}
              </div>
            </div>

            {canAutoFillPosters && (posterBackfill.isRunning || posterBackfill.finished) && (
              <div className="mb-4 rounded-xl border border-slate-700 bg-slate-900/70 px-3 py-3 text-xs text-slate-300">
                {posterBackfill.isRunning ? (
                  <>
                    <div className="flex items-center justify-between gap-3 mb-2">
                      <span className="flex items-center gap-1.5 text-teal-400 font-semibold">
                        <Loader2 className="w-3.5 h-3.5 animate-spin" /> {t.autoPosterFilling}
                      </span>
                      <span>{posterBackfill.processed}/{posterBackfill.total}</span>
                    </div>
                    <div className="h-1.5 overflow-hidden rounded-full bg-slate-800">
                      <div
                        className="h-full bg-teal-500 transition-all duration-300"
                        style={{ width: `${posterBackfill.total ? (posterBackfill.processed / posterBackfill.total) * 100 : 0}%` }}
                      ></div>
                    </div>
                  </>
                ) : posterBackfill.total === 0 ? (
                  <span className="text-slate-400">{t.autoPosterNone}</span>
                ) : (
                  <div>
                    <p className="font-semibold text-teal-400">{t.autoPosterDone}</p>
                    <p className="mt-1 text-slate-400">
                      {appLang === 'ko'
                        ? `등록 ${posterBackfill.saved}개 · 검색 결과 없음 ${posterBackfill.notFound}개 · 오류 ${posterBackfill.failed}개`
                        : `登録 ${posterBackfill.saved}件 · 検索結果なし ${posterBackfill.notFound}件 · エラー ${posterBackfill.failed}件`}
                    </p>
                  </div>
                )}
              </div>
            )}

            <div className="w-full overflow-hidden rounded-xl sm:rounded-2xl border border-slate-800 bg-slate-900/70 shadow-xl">
              <div className="grid grid-cols-7 border-b border-slate-800 bg-slate-900">
                {weekdayLabels.map((label, index) => (
                  <div key={label} className={`min-w-0 py-1.5 sm:py-2 text-center text-[9px] sm:text-xs font-semibold ${index === 0 ? 'text-red-400' : index === 6 ? 'text-sky-400' : 'text-slate-400'}`}>
                    {label}
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-7">
                {cells.map((cell, index) => (
                  <div
                    key={cell.dateKey}
                    className={`min-w-0 min-h-[98px] sm:min-h-[150px] lg:min-h-[188px] border-b border-r border-slate-800/80 p-0.5 sm:p-1.5 ${index % 7 === 6 ? 'border-r-0' : ''} ${index >= calendarCellCount - 7 ? 'border-b-0' : ''} ${cell.isCurrentMonth ? 'bg-slate-900/50' : 'bg-slate-950/45'}`}
                  >
                    <div className="flex justify-between items-center mb-0.5 sm:mb-1 px-0.5">
                      <span className={`w-4 h-4 sm:w-6 sm:h-6 rounded-full flex items-center justify-center text-[8px] sm:text-xs font-semibold ${cell.dateKey === todayKey ? 'bg-teal-500 text-slate-950' : cell.isCurrentMonth ? 'text-slate-300' : 'text-slate-600'}`}>
                        {cell.day}
                      </span>
                      {cell.reviews.length > 1 && (
                        <span className="text-[7px] sm:text-[10px] text-teal-400">+{cell.reviews.length - 1}</span>
                      )}
                    </div>

                    <div className="space-y-0.5 sm:space-y-1">
                      {cell.reviews.map(review => {
                        const posterUrl = getPosterUrl(review);
                        return (
                          <button
                            key={review.id}
                            type="button"
                            onClick={() => openPosterEditor(review)}
                            className={`poster-card relative block w-full min-w-0 aspect-[3/4] overflow-hidden rounded-[4px] sm:rounded-lg border border-slate-700/80 bg-slate-800 text-left transition-all group ${isOwner(review) ? 'hover:border-teal-400 hover:ring-1 hover:ring-teal-400/50 cursor-pointer' : 'cursor-default'}`}
                            title={isOwner(review) ? (posterUrl ? t.editPoster : t.addPoster) : review.movieTitle}
                          >
                            <span className="absolute inset-0 flex items-center justify-center bg-slate-800 text-slate-500 group-hover:text-teal-400 text-base sm:text-2xl">＋</span>
                            {posterUrl && (
                              <img
                                src={posterUrl}
                                alt={`${review.movieTitle} poster`}
                                className="absolute inset-0 w-full h-full object-cover"
                                loading="lazy"
                                referrerPolicy="no-referrer"
                                onError={e => { e.currentTarget.style.display = 'none'; }}
                              />
                            )}
                            <span className="absolute inset-x-0 bottom-0 z-10 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent px-0.5 pt-4 pb-0.5 sm:px-1.5 sm:pt-7 sm:pb-1.5">
                              <span
                                className="block text-[6px] sm:text-[9px] lg:text-[11px] leading-[1.05] sm:leading-tight font-semibold text-white break-words"
                                style={{
                                  display: '-webkit-box',
                                  WebkitLineClamp: 2,
                                  WebkitBoxOrient: 'vertical',
                                  overflow: 'hidden'
                                }}
                              >
                                {review.movieTitle}
                              </span>
                              <span className="block mt-0.5 text-[7px] sm:text-[9px] lg:text-[10px] leading-none font-bold text-yellow-400">★ {review.rating}</span>
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <p className="mt-3 text-[11px] text-slate-500 leading-relaxed">
              {appLang === 'ko'
                ? '새 리뷰의 포스터는 TMDB에서 자동 등록됩니다. 포스터를 누르면 언제든 직접 검색하거나 변경할 수 있습니다.'
                : '新しいレビューのポスターはTMDBから自動登録されます。ポスターを押すと、いつでも検索・変更できます。'}
            </p>
          </div>
        );
      };

      const formatRuntimeTotal = (minutes) => {
        const total = Math.max(0, Math.round(Number(minutes || 0)));
        const hours = Math.floor(total / 60);
        const remainMinutes = total % 60;
        if (hours <= 0) return `${remainMinutes}${t.runtimeStatsMinute}`;
        return `${hours}${t.runtimeStatsHour} ${remainMinutes}${t.runtimeStatsMinute}`;
      };

      const formatRuntimeEquivalent = (minutes) => {
        const total = Math.max(0, Math.round(Number(minutes || 0)));
        const days = Math.floor(total / 1440);
        const hours = Math.floor((total % 1440) / 60);
        const remainMinutes = total % 60;
        const parts = [];
        if (days > 0) parts.push(`${days}${t.runtimeStatsDay}`);
        if (hours > 0) parts.push(`${hours}${t.runtimeStatsHour}`);
        if (remainMinutes > 0 || parts.length === 0) parts.push(`${remainMinutes}${t.runtimeStatsMinute}`);
        return parts.join(' ');
      };

      const renderGenreTaste = (userReviews) => {
        if (isGenreStatsLoading) {
          return (
            <div className="genre-taste-shell rounded-2xl border border-slate-800 bg-slate-900 px-5 py-16 text-center shadow-xl">
              <div className="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-teal-500/10 text-teal-400">
                <Loader2 className="h-7 w-7 animate-spin" />
              </div>
              <p className="mt-4 text-sm text-slate-300">{t.genreStatsLoading}</p>
              <div className="genre-film-perforation mx-auto mt-5 h-3 w-40 rounded-full opacity-50"></div>
            </div>
          );
        }

        if (genreStatsError) {
          return (
            <div className="rounded-2xl border border-amber-500/30 bg-amber-500/10 px-5 py-10 text-center">
              <p className="text-sm text-amber-300">{t.genreStatsError}</p>
              <button
                type="button"
                onClick={() => loadGenreStats(selectedUser)}
                className="mt-4 rounded-lg border border-amber-400/40 bg-slate-900/70 px-4 py-2 text-xs font-semibold text-amber-200 transition-colors hover:border-amber-300"
              >
                {t.genreStatsRetry}
              </button>
            </div>
          );
        }

        const genres = genreStats?.genres || [];
        if (!genreStats || genres.length === 0) {
          return (
            <div className="rounded-2xl border border-dashed border-slate-700 bg-slate-900/50 px-5 py-14 text-center">
              <Film className="mx-auto h-8 w-8 text-slate-600" />
              <p className="mt-3 text-sm text-slate-400">{t.genreStatsEmpty}</p>
              <button
                type="button"
                onClick={() => loadGenreStats(selectedUser)}
                className="mt-4 rounded-lg bg-teal-500 px-4 py-2 text-xs font-bold text-slate-950 transition-colors hover:bg-teal-400"
              >
                {t.genreStatsRetry}
              </button>
            </div>
          );
        }

        const topGenre = genres[0];
        const persona = buildGenrePersona(
          genres,
          selectedUser,
          currentUser,
          appLang,
          Number(genreStats.averageRating || 0),
          userReviews
        );
        const totalGenreWeight = genres.reduce((sum, genre) => sum + Number(genre.weight || 0), 0) || 1;

        // 도넛과 목록 모두 전체 장르를 같은 기준으로 사용합니다.
        // 낮은 비중의 장르도 기타로 묶지 않고 각각 독립된 조각과 행으로 표시합니다.
        let cursor = 0;
        const gradientParts = genres.map((genre, index) => {
          const start = cursor;
          cursor += (Number(genre.weight || 0) / totalGenreWeight) * 100;
          const end = index === genres.length - 1 ? 100 : cursor;
          return `${GENRE_CHART_COLORS[index % GENRE_CHART_COLORS.length]} ${start.toFixed(3)}% ${end.toFixed(3)}%`;
        });
        const donutBackground = `conic-gradient(${gradientParts.join(', ')})`;
        const averageRating = Number(genreStats.averageRating || 0);
        const runtimeStats = genreStats.runtimeStats || {};
        const keywordStats = genreStats.keywordStats || {};
        const keywords = Array.isArray(keywordStats.keywords) ? keywordStats.keywords : [];
        const mostFrequentKeyword = keywordStats.mostFrequentKeyword || keywords[0] || null;
        const bestRatedKeyword = keywordStats.bestRatedKeyword || null;
        const maxKeywordCount = keywords.reduce((max, keyword) => Math.max(max, Number(keyword.movieCount || 0)), 1);

        // 표시용 정수 퍼센트는 전체 장르를 대상으로 최대 나머지 방식으로 보정합니다.
        // 따라서 화면에 표시되는 모든 행의 합계는 정확히 100%가 됩니다.
        const rawGenreRows = genres.map(genre => ({
          ...genre,
          rawPercentage: (Number(genre.weight || 0) / totalGenreWeight) * 100
        }));
        const flooredPercentages = rawGenreRows.map(row => Math.floor(row.rawPercentage));
        let percentagePointsLeft = 100 - flooredPercentages.reduce((sum, value) => sum + value, 0);
        const remainderOrder = rawGenreRows
          .map((row, index) => ({
            index,
            remainder: row.rawPercentage - Math.floor(row.rawPercentage)
          }))
          .sort((a, b) => b.remainder - a.remainder || a.index - b.index);
        const displayPercentages = [...flooredPercentages];
        for (let index = 0; index < percentagePointsLeft; index++) {
          const target = remainderOrder[index % remainderOrder.length];
          if (target) displayPercentages[target.index] += 1;
        }
        const genreListRows = rawGenreRows.map((row, index) => ({
          ...row,
          displayPercentage: displayPercentages[index]
        }));

        return (
          <div className="space-y-5 animate-in fade-in slide-in-from-bottom-3 duration-500">
            <section className="rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-7 shadow-xl">
              <div className="flex flex-wrap items-start justify-between gap-4">
                <div>
                  <p className="text-[10px] font-bold tracking-[0.28em] text-indigo-300">{t.runtimeStatsEyebrow}</p>
                  <h3 className="mt-2 text-xl font-black text-white sm:text-2xl">{t.runtimeStatsTitle}</h3>
                  <p className="mt-1 max-w-xl text-xs leading-relaxed text-slate-400 sm:text-sm">{t.runtimeStatsIntro}</p>
                </div>
                <Calendar className="h-7 w-7 text-indigo-300" />
              </div>

              <div className="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                <div className="rounded-2xl border border-indigo-400/25 bg-indigo-400/5 p-5 sm:col-span-2">
                  <p className="text-[10px] font-bold tracking-[0.16em] text-indigo-300">{t.runtimeStatsTotal}</p>
                  <p className="mt-3 break-words text-3xl font-black text-white sm:text-4xl">
                    {formatRuntimeTotal(runtimeStats.totalMinutes || 0)}
                  </p>
                  <p className="mt-2 text-xs text-slate-400">
                    {t.runtimeStatsEquivalent} · {formatRuntimeEquivalent(runtimeStats.totalMinutes || 0)}
                  </p>
                </div>

                <div className="rounded-2xl border border-slate-800 bg-slate-950/45 p-4">
                  <p className="text-[10px] font-bold tracking-[0.12em] text-slate-500">{t.runtimeStatsAverage}</p>
                  <p className="mt-3 text-2xl font-black text-white">
                    {Number(runtimeStats.averageMinutes || 0) > 0
                      ? `${Math.round(Number(runtimeStats.averageMinutes))}${t.runtimeStatsMinute}`
                      : '-'}
                  </p>
                  <p className="mt-1 text-[10px] text-slate-500">
                    {runtimeStats.analyzedCount || 0}{t.genreStatsUnit} · {t.runtimeStatsAnalyzed}
                  </p>
                </div>

                <div className="rounded-2xl border border-slate-800 bg-slate-950/45 p-4">
                  <p className="text-[10px] font-bold tracking-[0.12em] text-slate-500">{t.runtimeStatsLongest}</p>
                  {runtimeStats.longestMovie ? (
                    <>
                      <p className="mt-3 line-clamp-2 text-sm font-bold leading-snug text-white">{runtimeStats.longestMovie.title}</p>
                      <p className="mt-2 text-lg font-black text-indigo-300">{runtimeStats.longestMovie.runtime}{t.runtimeStatsMinute}</p>
                    </>
                  ) : (
                    <p className="mt-3 text-2xl font-black text-slate-600">-</p>
                  )}
                </div>
              </div>

              <div className="mt-5 border-t border-slate-800 pt-4">
                <p className="text-[10px] leading-relaxed text-slate-500">ⓘ {t.runtimeStatsMethod}</p>
                {Number(runtimeStats.unresolvedCount || 0) > 0 && (
                  <p className="mt-1.5 text-[10px] text-amber-400/80">
                    {t.runtimeStatsUnresolved}: {runtimeStats.unresolvedCount}{t.genreStatsUnit}
                  </p>
                )}
              </div>
            </section>

            <section className="genre-taste-shell rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-7 shadow-xl">
              <div className="flex flex-wrap items-start justify-between gap-4">
                <div>
                  <p className="text-[10px] font-bold tracking-[0.28em] text-teal-400">{t.genreStatsEyebrow}</p>
                  <h3 className="mt-2 text-xl font-black text-white sm:text-2xl">{t.genreStatsTitle}</h3>
